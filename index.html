<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藏器魂 · 企业镜像分身</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: "KaiTi", "楷体", "PingFang SC", system-ui, sans-serif;
            background: #1a1a1a;
            color: #e8e8e8;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-card: #fafafa;
            --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #999999;
            --border-color: #e0e0e0;
            --accent: #10a37f;
            --accent-hover: #1a7a64;
            --sidebar-width: 200px;
        }

        #appContainer {
            display: none;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            height: 48px;
            min-height: 48px;
        }

        .topbar-left .logo {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .topbar-left .logo span {
            color: var(--text-muted);
            font-weight: normal;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-badge {
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 12px;
            background: var(--accent);
            color: #0a0a0a;
            font-weight: bold;
        }

        .gate-indicator {
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .gate-indicator.local {
            background: #2d5a3d;
            color: #8fbc8f;
        }

        .gate-indicator.cloud {
            background: #1a3a5c;
            color: #87ceeb;
        }

        .header-btn {
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            height: 28px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .model-select {
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            height: 28px;
        }

        .token-display {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        .token-display {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        .main-body {
            display: flex;
            flex: 1;
            min-height: 0;
            background: var(--bg-primary);
        }

        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-header {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-header .badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .sidebar-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 8px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            background: var(--bg-primary);
            min-width: 0;
        }

        .chat-area .message {
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        .chat-area .message.system {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 4px 0;
        }

        .chat-area .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .chat-area .message.user .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px 12px 4px 12px;
            max-width: 75%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .chat-area .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .chat-area .message.assistant .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px 12px 12px 4px;
            max-width: 85%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px 12px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            min-height: 52px;
        }

        .input-area .tool-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            height: 36px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .input-area .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 36px;
            max-height: 100px;
            outline: none;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area .send-btn {
            padding: 6px 20px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        .audit-panel,
        .memory-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 480px;
            max-width: 90vw;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .audit-panel .close-btn,
        .memory-panel .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        .audit-item,
        .memory-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .intro-overlay .line {
            font-size: 22px;
            color: var(--text-primary);
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            margin: 4px 0;
        }

        .intro-overlay .line:nth-child(1) {
            animation-delay: 0s;
        }

        .intro-overlay .line:nth-child(2) {
            animation-delay: 0.6s;
        }

        .intro-overlay .line:nth-child(3) {
            animation-delay: 1.2s;
        }

        .intro-overlay .line:nth-child(4) {
            animation-delay: 1.8s;
        }

        .intro-overlay .public-btn {
            margin-top: 30px;
            padding: 12px 36px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: transparent;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .intro-overlay .public-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }

        .intro-overlay .secret-trigger {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px dotted var(--text-muted);
        }

        .intro-overlay .secret-trigger:hover {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 160px;
            }

            .topbar {
                padding: 4px 12px;
                height: 40px;
                min-height: 40px;
                flex-wrap: wrap;
            }

            .topbar-right {
                gap: 4px;
            }

            .header-btn,
            .model-select {
                font-size: 10px;
                height: 24px;
            }

            .chat-area {
                padding: 10px 12px;
            }

            .input-area {
                padding: 4px 8px 8px 8px;
                flex-wrap: wrap;
            }

            .input-area .tool-btn {
                font-size: 10px;
                padding: 4px 10px;
                height: 30px;
            }

            .input-area textarea {
                font-size: 13px;
                min-height: 30px;
            }

            .input-area .send-btn {
                font-size: 12px;
                padding: 4px 14px;
                height: 30px;
            }

            .audit-panel,
            .memory-panel {
                width: 100vw;
                max-width: 100vw;
            }
        }
    </style>
</head>

<body>

    <div class="intro-overlay" id="introOverlay">
        <div class="line">咻——</div>
        <div class="line">一道光从边缘划过，</div>
        <div class="line">光落处，浮出一行字：</div>
        <div class="line">"企业镜像已就绪。"</div>
        <button class="public-btn" id="enterPublicBtn">🏢 进入企业镜像</button>
        <div class="secret-trigger" id="secretTrigger">🔑 管理员通道</div>
    </div>

    <div id="appContainer">
        <div class="topbar">
            <div class="topbar-left">
                <div class="logo">藏器魂 <span>· 企业镜像</span></div>
            </div>
            <div class="topbar-right">
                <span class="gate-indicator" id="gateIndicator" title="当前阀门状态">⚪ 待命</span>
                <select class="model-select" id="modelSelect">
                    <option value="qwen3:4b" selected>本地模型 Qwen3:4B</option>
                    <option value="qwen3:1.5b">本地模型 Qwen3:1.5B</option>
                    <option value="qwen3:14b">本地模型 Qwen3:14B</option>
                    <option value="qwen3:32b">本地模型 Qwen3:32B</option>
                    <option value="deepseek-chat">DeepSeek Chat</option>
                    <option value="deepseek-reasoner">DeepSeek Reasoner</option>
                    <option value="bailian-chat">百炼 ChatGPT</option>
                    <option value="glm-4.7-flash">智谱 GLM-4.7-Flash</option>
                    <option value="qwq-32b">阿里 QwQ-32B</option>
                </select>
                <span class="token-display" id="tokenDisplay" onclick="openTokenDrawer()" title="点击查看Token详情">💰 0
                    Token</span>
            </div>
        </div>
        <div class="main-body">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span>分身</span>
                    <span class="badge">企业ID: CANGQI_001</span>
                </div>
                <div class="sidebar-list" id="convList"></div>
                <div class="sidebar-footer">🏢 企业镜像</div>
            </div>
            <div class="chat-area" id="chatArea"></div>
        </div>
        <div class="input-area">
            <button class="tool-btn" onclick="openFileExplorer()">📂 文件夹</button>
            <textarea id="userInput" rows="1" placeholder="输入您的话... (Enter发送)"></textarea>
            <button class="tool-btn" onclick="clearScreen()">🧹 清屏</button>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // ================================================================
        // 藏器魂 · 企业镜像分身系统 —— B系统（全血栓疏通版）
        // ================================================================
        const API_BASE = 'http://127.0.0.1:18889';

        // ===== 全局请求封装 =====
        async function apiGet(path) {
            const res = await fetch(API_BASE + path, { signal: AbortSignal.timeout(15000) });
            return res.json();
        }
        async function apiPost(path, body) {
            const res = await fetch(API_BASE + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(30000)
            });
            return res.json();
        }

        const ENTERPRISE_ID = 'CANGQI_001';
        let messages = [];
        let currentConversationId = null;
        let conversations = {};
        let tokenUsed = parseInt(localStorage.getItem('tokenUsed') || '0');
        window._executionLogs = [];

        // ===== 阀门状态指示器 =====
        function updateGateIndicator(gate) {
            const indicator = document.getElementById('gateIndicator');
            if (!indicator) return;
            if (gate === 'local') {
                indicator.textContent = '🏠 本地';
                indicator.className = 'gate-indicator local';
            } else if (gate === 'cloud') {
                indicator.textContent = '☁️ 云端';
                indicator.className = 'gate-indicator cloud';
            } else {
                indicator.textContent = '⚪ 待命';
                indicator.className = 'gate-indicator';
            }
        }

        // ===== 心跳检测 =====
        async function checkBackendHealth() {
            try {
                const res = await apiGet('/api/health');
                return res.status === 'ok';
            } catch (e) { return false; }
        }
        setInterval(async function () {
            const alive = await checkBackendHealth();
            const badge = document.getElementById('modeBadge');
            if (badge) {
                badge.textContent = alive ? '企业模式' : '⚠️ 离线模式';
                badge.style.background = alive ? '#10a37f' : '#c0392b';
            }
        }, 30000);

        // ===== 审计落盘 =====
        window.flushAuditLog = async function () {
            if (!window._executionLogs || window._executionLogs.length === 0) return;
            const logPath = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\audit\\audit.log';
            const lines = window._executionLogs.map(function (log) {
                return JSON.stringify({
                    timestamp: log.timestamp || new Date().toISOString(),
                    executionPath: log.executionPath || 'unknown',
                    assetHit: log.assetHit || '无',
                    originalContent: (log.originalContent || '').slice(0, 200)
                });
            }).join('\n') + '\n';
            try {
                const data = await apiPost('/api/file/read', { path: logPath });
                const existing = data.success && data.content ? data.content : '';
                await apiPost('/api/file/write', { filePath: logPath, content: existing + lines });
                window._executionLogs = [];
            } catch (e) { console.warn('审计落盘失败:', e); }
        };

        // ===== 记忆系统 =====
        const memoryManager = {
            getMemoryPath: function () {
                let avatarName = currentConversationId || '傅王侯';
                if (!avatarName || avatarName === 'null' || avatarName === 'undefined') avatarName = '傅王侯';
                return 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\memory.json';
            },
            getPreferencesPath: function () {
                let avatarName = currentConversationId || '傅王侯';
                if (!avatarName || avatarName === 'null' || avatarName === 'undefined') avatarName = '傅王侯';
                return 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\preferences.json';
            },
            save: async function (entry) {
                try {
                    const memories = await this.loadAll();
                    memories.push({ id: 'mem_' + Date.now(), timestamp: new Date().toISOString(), role: entry.role || 'user', content: entry.content || '', sessionId: currentConversationId });
                    if (memories.length > 200) memories.splice(0, memories.length - 200);
                    await apiPost('/api/file/write', { filePath: this.getMemoryPath(), content: JSON.stringify(memories, null, 2) });
                } catch (e) {
                    const old = JSON.parse(localStorage.getItem('cangqihun_memory') || '[]');
                    old.push(entry);
                    localStorage.setItem('cangqihun_memory', JSON.stringify(old));
                }
            },
            loadAll: async function () {
                try {
                    const data = await apiPost('/api/file/read', { path: this.getMemoryPath() });
                    if (data.success && data.content) return JSON.parse(data.content);
                    return [];
                } catch (e) {
                    try { const old = localStorage.getItem('cangqihun_memory'); return old ? JSON.parse(old) : []; } catch (e2) { return []; }
                }
            },
            clear: async function () {
                try { await apiPost('/api/file/write', { filePath: this.getMemoryPath(), content: JSON.stringify([]) }); } catch (e) { localStorage.removeItem('cangqihun_memory'); }
            },
            savePreference: async function (key, value) {
                try {
                    const res = await apiPost('/api/file/read', { path: this.getPreferencesPath() });
                    const prefs = res.success && res.content ? JSON.parse(res.content) : {};
                    prefs[key] = value;
                    await apiPost('/api/file/write', { filePath: this.getPreferencesPath(), content: JSON.stringify(prefs, null, 2) });
                } catch (e) { console.warn('保存偏好失败:', e); }
            },
            loadPreference: async function (key) {
                try {
                    const res = await apiPost('/api/file/read', { path: this.getPreferencesPath() });
                    if (res.success && res.content) { const prefs = JSON.parse(res.content); return prefs[key] || null; }
                    return null;
                } catch (e) { return null; }
            }
        };

        // ===== 学习容器 —— 血栓A疏通：上下行双向 =====
        const learner = {
            // 本地缓存的阀门策略（从后端同步）
            _strategy: null,
            _lastSync: 0,

            // 从后端阀门拉取最新策略
            sync: async function () {
                try {
                    const res = await apiGet('/api/valve/status');
                    if (res.success) {
                        this._strategy = res;
                        this._lastSync = Date.now();
                        console.log('📚 学习容器同步阀门状态:', res.recentGates);
                    }
                } catch (e) { console.warn('阀门状态同步失败:', e); }
            },

            // 判断是否应该跳过反问确认（血栓B：减少弹窗）
            shouldSkipConfirm: function (userInput) {
                if (!this._strategy || !this._strategy.recentGates) return false;
                // 如果最近决策中 task/local 占比超过 60%，且当前输入含任务关键词 → 跳过确认
                const total = this._strategy.recentGates.local + this._strategy.recentGates.cloud;
                if (total < 5) return false;
                const localRatio = this._strategy.recentGates.local / total;
                const hasTaskKeyword = /审查|清洗|审计|审核|审合同/.test(userInput);
                return hasTaskKeyword && localRatio > 0.6;
            },

            // 记录交互并反馈给阀门
            record: async function (record) {
                console.log('📚 学习容器:', { input: record.userInput.slice(0, 50), confirmed: record.confirmed, intent: record.intent });
                // 上行：记录到记忆系统
                await memoryManager.save({
                    role: 'system',
                    content: '📚 学习记录：' + JSON.stringify({ input: record.userInput.slice(0, 100), confirmed: record.confirmed, intent: record.intent })
                });
                // 上行：反馈给阀门
                try {
                    await apiPost('/api/valve/feed', {
                        samples: [{ message: record.userInput, gate: record.intent === 'task' ? 'local' : 'cloud', source: 'learner' }]
                    });
                } catch (e) { console.warn('阀门反馈失败:', e); }
                // 下行：拉取更新后的策略
                await this.sync();
            }
        };

        function getWindowDisplayName(windowId) {
            const conv = conversations[windowId];
            if (!conv) return windowId || 'unknown';
            if (conv.title && conv.title !== '新对话' && conv.title !== '主窗口') return conv.title;
            return conv.windowIdentity || windowId || 'unknown';
        }

        async function loadWindowMessagesFromFile(windowId) {
            const conv = conversations[windowId];
            if (!conv) return null;
            const displayName = getWindowDisplayName(windowId);
            if (!displayName || displayName === '新对话' || displayName === 'main' || displayName === '主窗口' || displayName === 'unknown') return null;
            try {
                const data = await apiPost('/api/avatar/messages/read', { avatarName: displayName });

                });

                    document.getElementById('tokenDisplay').textContent = '💰 ' + tokenUsed.toLocaleString() + ' Token';

                    console.warn('本地降级也失败:', e2.message);
                }

                if (e.name === 'AbortError' || e.message.includes('aborted')) {

                { keywords: ['审计', '审计日志', '追溯', '操作记录'], file: 'audit.json' }
            ];
            const basePath = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\soul\\rules\\';
            let targetFile = null;
            for (let i = 0; i < ruleMap.length; i++) {
                for (let j = 0; j < ruleMap[i].keywords.length; j++) {
                    if (userInput.includes(ruleMap[i].keywords[j])) { targetFile = ruleMap[i].file; break; }

                const rules = JSON.parse(data.content).rules || [];

                    for (let j = 0; j < rules[i].keywords.length; j++) {
                        if (userInput.includes(rules[i].keywords[j])) {

                                assetName: rules[i].name || '规则命中',
                                confidence: rules[i].confidence || 0.8,
                                result: rules[i].response || '已按规则执行',
                                ruleId: rules[i].id || 'rule_' + Date.now(),
                                sourceFile: targetFile
                            };
                        }
                    }
                }
                return null;
            } catch (e) { return null; }
        }

        async function checkRiskLibrary(userIntent) {
            const indexData = await apiPost('/api/file/read', { path: 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\傅王侯\\soul\\risk_index.json' });
            if (!indexData.success) return { found: false, reason: '资产库索引不存在' };
            const index = JSON.parse(indexData.content);
            const match = userIntent.match(/(.+?)合同/);
            if (!match) return { found: false, reason: '未识别到合同类型' };
            const type = match[1].trim();
            for (const category in index) {
                for (const contractType in index[category]) {
                    if (contractType.includes(type)) return { found: true, category, contractType, path: index[category][contractType] };
                }
            }
            return { found: false, reason: '资产库中暂无该类型合同风险条目' };
        }

                    return;
                } else {
                    const shouldOnline = window.confirm('📌 资产库中暂无「' + contractType.trim() + '」合同风险条目。\n是否联网使用大模型分析？');
                    if (shouldOnline) {
                        addMessage('system', '🌐 正在联网处理...');
                        const reply = await getAIResponse(userInput + '\n\n【用户需求】审查「' + contractType.trim() + '」合同');
                        document.querySelectorAll('.message.system').forEach(el => { if (el.textContent.includes('正在思考...')) el.remove(); });
                        const confirmed = await showResultPreview(reply, 'ai.json');
                        if (confirmed) await saveResultToFile(reply);
                        addMessage('assistant', reply);
                        window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'cloud', assetHit: '无（联网处理）', originalContent: userInput, fileContent: fileContent.slice(0, 500) });
                        await memoryManager.save({ role: 'user', content: userInput });
                        await memoryManager.save({ role: 'assistant', content: reply });
                        try { await flushAuditLog(); } catch (e) { }
                        return;
                    } else { addMessage('system', '📌 您选择不联网，任务结束。'); return; }
                }
            }

            const filePathMatch = userInput.match(/([A-Za-z]:\\[^\\s]*\.(txt|docx|xlsx|pdf|doc))/i);
            if (filePathMatch) {
                filePath = filePathMatch[1];
                try {
                    const readData = await apiPost('/api/file/read', { path: filePath });
                    if (readData.success && readData.content) {
                        fileContent = readData.content;
                        addMessage('system', '✅ 文件读取成功，共 ' + fileContent.length + ' 字符');
                    }
                } catch (e) { addMessage('system', '⚠️ 文件读取失败: ' + e.message); }
            }

            const ruleResult = await localRuleEngine(userInput, avatarName);
            if (ruleResult) {
                let finalResult = ruleResult.result;
                if (ruleResult.sourceFile === 'audit.json') {
                    try {
                        const auditData = await apiPost('/api/file/read', { path: 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\audit\\audit.log' });
                        if (auditData.success && auditData.content) {
                            const logs = auditData.content.trim().split('\n').slice(-10);
                            finalResult = '【审计日志查询结果】\n\n共 ' + logs.length + ' 条最新记录：\n\n' + logs.map((line, i) => { try { const obj = JSON.parse(line); return (i + 1) + '. ' + obj.timestamp + ' | ' + obj.executionPath + ' | ' + obj.assetHit; } catch (e) { return (i + 1) + '. ' + line.slice(0, 80); } }).join('\n');
                        } else { finalResult = '【审计日志查询结果】\n\n📭 暂无审计记录。'; }
                    } catch (e) { finalResult = '【审计日志查询结果】\n\n⚠️ 无法读取审计文件: ' + e.message; }
                }

                const confirmed = await showResultPreview(finalResult, ruleResult.sourceFile);
                if (confirmed) {
                    await saveResultToFile(finalResult, ruleResult.sourceFile);
                    window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'local', assetHit: ruleResult.assetName, originalContent: userInput });
                } else {
                    const upgradeChoice = window.confirm('📌 本次审核由本地规则引擎完成。\n如需更深度审查，建议联网升级。\n数据将脱敏后转发大模型，是否继续？');
                    if (upgradeChoice) {
                        addMessage('system', '🌐 正在联网升级处理...');
                        const desensitizedContent = fileContent ? desensitizeData(fileContent) : '';
                        const promptText = desensitizedContent ? userInput + '\n\n【脱敏后的文件内容】\n' + desensitizedContent : userInput + '\n\n【文件内容】\n' + (fileContent || '').slice(0, 3000);
                        const reply = await getAIResponse(promptText);
                        document.querySelectorAll('.message.system').forEach(el => { if (el.textContent.includes('正在思考...')) el.remove(); });
                        const aiConfirmed = await showResultPreview(reply, 'ai.json');
                        if (aiConfirmed) await saveResultToFile(reply);
                        addMessage('assistant', reply);
                        window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'cloud', assetHit: '无（联网升级）', originalContent: userInput, fileContent: fileContent.slice(0, 500) });
                        await memoryManager.save({ role: 'user', content: userInput });
                        await memoryManager.save({ role: 'assistant', content: reply });
                        try { await flushAuditLog(); } catch (e) { }
                        return;
                    }
                }
                addMessage('assistant', finalResult);
                try { await flushAuditLog(); } catch (e) { }
                return;
            }

            addMessage('system', '📌 本地规则引擎未命中该任务。');
            const shouldOnline = suggestOnlineMode(userInput);
            if (!shouldOnline) { addMessage('system', '📌 您选择不联网，任务已结束。'); return; }

            addMessage('system', '🤔 正在思考...');
            const desensitizedContent = fileContent ? desensitizeData(fileContent) : '';
            const promptText = desensitizedContent ? userInput + '\n\n【脱敏后的文件内容】\n' + desensitizedContent : userInput + '\n\n【文件内容】\n' + (fileContent || '').slice(0, 3000);
            const reply = await getAIResponse(promptText);
            document.querySelectorAll('.message.system').forEach(el => { if (el.textContent.includes('正在思考...')) el.remove(); });
            const aiConfirmed = await showResultPreview(reply, 'ai.json');
            if (aiConfirmed) await saveResultToFile(reply);
            addMessage('assistant', reply);
            window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'cloud', assetHit: '无（联网处理）', originalContent: userInput, fileContent: fileContent.slice(0, 500) });
            await memoryManager.save({ role: 'user', content: userInput });
            await memoryManager.save({ role: 'assistant', content: reply });
            try { await flushAuditLog(); } catch (e) { }
        }

        async function saveResultToFile(content, sourceFile) {
            try {
                const folderHandle = await window.showDirectoryPicker();
                const fileName = (sourceFile === 'clean.json' ? '清洗结果_' : '报告_') + Date.now() + (sourceFile === 'clean.json' ? '.csv' : '.txt');
                const fileHandle = await folderHandle.getFileHandle(fileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();
                addMessage('system', '✅ 结果已保存到: ' + folderHandle.name + '\\' + fileName);
            } catch (e) {
                const fallbackPath = window.prompt('请手动输入完整保存路径（含文件名）：', 'C:\\cangqihun_enterprise\\outputs\\报告_' + Date.now() + '.txt');
                if (fallbackPath && fallbackPath.trim() !== '') {
                    try {
                        await apiPost('/api/file/write', { filePath: fallbackPath, content });
                        addMessage('system', '✅ 结果已保存到: ' + fallbackPath);
                    } catch (err) { addMessage('system', '❌ 保存失败: ' + err.message); }
                }
            }
        }

        // ===== sendMessage —— 血栓B疏通：学习容器驱动分流器 =====
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;
            input.value = '';
            addMessage('user', rawText);

            const isTaskKeyword = /审查|清洗|审计|审核|审合同|帮我|我要|看看|审一下/.test(rawText);
            const interactionRecord = {
                timestamp: new Date().toISOString(),
                userInput: rawText,
                isTaskKeyword,
                intent: 'unknown',
                confirmed: false,
                result: null
            };

            if (isTaskKeyword) {
                // 血栓B：学习容器判断是否跳过反问
                const skipConfirm = learner.shouldSkipConfirm(rawText);
                let confirmed = true;
                if (!skipConfirm) {
                    confirmed = await showConfirmDialog('📌 检测到任务指令，是否进入「藏器魂」任务调度？', '是，执行任务', '否，普通对话');
                } else {
                    console.log('📚 学习容器判断：跳过反问，自动进入任务调度');
                }
                interactionRecord.confirmed = confirmed;

                if (!confirmed) {
                    const reply = await getAIResponse(rawText);
                    addMessage('assistant', reply);
                    interactionRecord.intent = 'chat';
                    interactionRecord.result = reply;
                    await learner.record(interactionRecord);
                    return;
                }
                interactionRecord.intent = 'task';
                await sovereignDispatch(rawText);
                interactionRecord.result = 'task_executed';
                await learner.record(interactionRecord);
                return;
            }

            const reply = await getAIResponse(rawText);
            addMessage('assistant', reply);
            interactionRecord.intent = 'chat';
            interactionRecord.result = reply;
            await learner.record(interactionRecord);
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', async function () {
            console.log('🏢 企业镜像系统初始化...');
            // 恢复 Token 显示
            const savedTokens = parseInt(localStorage.getItem('tokenUsed') || '0');
            if (savedTokens > 0) {
                tokenUsed = savedTokens;
                document.getElementById('tokenDisplay').textContent = '💰 ' + tokenUsed.toLocaleString() + ' Token';
            }
            // 同步阀门策略
            await learner.sync();

            try {
                const data = await apiGet('/api/avatars/list');
                if (data.success && data.avatars.length > 0) {
                    data.avatars.forEach(name => {
                        if (!conversations[name]) conversations[name] = {
                            id: name, messages: [], title: name,
                            windowIdentity: name
                        };
                    });
                    console.log('✅ 已加载分身:', data.avatars.join(', '));
                } else {
                    conversations['傅王侯'] = { id: '傅王侯', messages: [], title: '傅王侯', windowIdentity: '傅王侯' };
                }
                localStorage.setItem('ruling_conversations', JSON.stringify(conversations));
            } catch (e) {
                const saved = localStorage.getItem('ruling_conversations');
                if (saved) { try { conversations = JSON.parse(saved); } catch (e2) { } }
            }

            const savedId = localStorage.getItem('ruling_current_conv_id');
            if (savedId && conversations[savedId]) {
                currentConversationId = savedId;
                messages = conversations[savedId].messages || [];
            } else {
                const firstId = Object.keys(conversations)[0];
                if (firstId) {
                    currentConversationId = firstId;
                    messages = conversations[firstId].messages || [];
                    localStorage.setItem('ruling_current_conv_id', currentConversationId);
                }
            }

            renderConversationList();
            clearChatArea();
            restoreChatArea();
            document.getElementById('introOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            console.log('🎉 企业镜像系统就绪');

            document.getElementById('userInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            document.getElementById('enterPublicBtn').onclick = function () {
                document.getElementById('introOverlay').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
            };
            document.getElementById('secretTrigger').onclick = function () {
                if (prompt('请输入管理员口令：', '') === 'cangqihun') {
                    document.getElementById('introOverlay').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                } else { alert('口令错误'); }
            };
        });
    </script>
