<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藏器魂 · 企业镜像分身</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <!-- 新增以下两行 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: "KaiTi", "楷体", "PingFang SC", system-ui, sans-serif;
            background: #1a1a1a;
            color: #e8e8e8;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-card: #fafafa;
            --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #999999;
            --border-color: #e0e0e0;
            --accent: #10a37f;
            --accent-hover: #1a7a64;
            --sidebar-width: 200px;
        }

        #appContainer {
            display: none;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            height: 65px;
            min-height: 65px;
        }

        .topbar-left .logo {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .topbar-left .logo span {
            color: var(--text-muted);
            font-weight: normal;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-badge {
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 12px;
            background: var(--accent);
            color: #0a0a0a;
            font-weight: bold;
        }

        .gate-indicator {
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .gate-indicator.local {
            background: #2d5a3d;
            color: #8fbc8f;
        }

        .gate-indicator.cloud {
            background: #1a3a5c;
            color: #87ceeb;
        }

        .header-btn {
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            height: 28px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .model-select {
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            height: 28px;
        }

        .token-display {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        .token-display {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        .main-body {
            display: flex;
            flex: 1;
            min-height: 0;
            background: var(--bg-primary);
        }

        .sidebar {
            width: 180px;
            flex-shrink: 0;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-header {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-header .badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .sidebar-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 8px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            background: var(--bg-primary);
            min-width: 0;
        }

        .chat-area .message {
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        .chat-area .message.system {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 4px 0;
        }

        .chat-area .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .chat-area .message.user .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px 12px 4px 12px;
            max-width: 75%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .chat-area .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .chat-area .message.assistant .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px 12px 12px 4px;
            max-width: 85%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px 12px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            min-height: 52px;
        }

        .input-area .tool-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            height: 36px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .input-area .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 36px;
            max-height: 100px;
            outline: none;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area .send-btn {
            padding: 6px 20px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        .audit-panel,
        .memory-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 480px;
            max-width: 90vw;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .audit-panel .close-btn,
        .memory-panel .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        .audit-item,
        .memory-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .intro-overlay .line {
            font-size: 22px;
            color: var(--text-primary);
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            margin: 4px 0;
        }

        .intro-overlay .line:nth-child(1) {
            animation-delay: 0s;
        }

        .intro-overlay .line:nth-child(2) {
            animation-delay: 0.6s;
        }

        .intro-overlay .line:nth-child(3) {
            animation-delay: 1.2s;
        }

        .intro-overlay .line:nth-child(4) {
            animation-delay: 1.8s;
        }

        .intro-overlay .public-btn {
            margin-top: 30px;
            padding: 12px 36px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: transparent;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .intro-overlay .public-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }

        .intro-overlay .secret-trigger {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px dotted var(--text-muted);
        }

        .intro-overlay .secret-trigger:hover {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 160px;
            }

            .topbar {
                padding: 4px 12px;
                height: 40px;
                min-height: 40px;
                flex-wrap: wrap;
            }

            .topbar-right {
                gap: 4px;
            }

            .header-btn,
            .model-select {
                font-size: 10px;
                height: 24px;
            }

            .chat-area {
                padding: 10px 12px;
            }

            .input-area {
                padding: 4px 8px 8px 8px;
                flex-wrap: wrap;
            }

            .input-area .tool-btn {
                font-size: 10px;
                padding: 4px 10px;
                height: 30px;
            }

            .input-area textarea {
                font-size: 13px;
                min-height: 30px;
            }

            .input-area .send-btn {
                font-size: 12px;
                padding: 4px 14px;
                height: 30px;
            }

            .audit-panel,
            .memory-panel {
                width: 100vw;
                max-width: 100vw;
            }
        }

        /* ===== 全局演示增强样式 ===== */
        body {
            font-size: 16px;
        }

        .topbar {
            height: 56px;
            min-height: 56px;
            padding: 8px 24px;
            background: #0d0d0d;
        }

        .topbar-left .logo {
            font-size: 20px;
        }

        .gate-indicator {
            background: #1a1a1a;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 4px 14px;
            border: 2px solid #666;
            border-radius: 6px;
        }

        .header-btn {
            background: #1a1a1a;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            height: 36px;
            padding: 6px 16px;
            border: 2px solid #555;
        }

        .header-btn:hover {
            background: #333;
            color: #fff;
        }

        .token-display {
            background: #1a1a1a;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            padding: 4px 12px;
            border: 2px solid #555;
        }

        .model-select {
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            height: 36px;
            border: 2px solid #555;
        }

        .sidebar {
            width: 220px;
        }

        .sidebar-item {
            font-size: 15px;
            padding: 10px 20px;
        }

        .chat-area {
            padding: 20px 28px;
        }

        .chat-area .message.user .bubble {
            font-size: 15px;
            padding: 12px 18px;
        }

        .chat-area .message.assistant .bubble {
            font-size: 15px;
            padding: 12px 18px;
        }

        .chat-area .message.system {
            font-size: 14px;
        }

        .input-area textarea {
            font-size: 15px;
            padding: 10px 14px;
            min-height: 42px;
        }

        .input-area .send-btn {
            font-size: 15px;
            height: 42px;
            padding: 8px 24px;
        }

        .input-area .tool-btn {
            font-size: 14px;
            height: 42px;
            padding: 8px 18px;
        }

        .drawer-panel {
            background: #0d0d0d;
            border-left: 2px solid #555;
            color: #e0e0e0;
        }

        .drawer-panel h3 {
            color: #fff;
            font-size: 18px;
        }

        .drawer-panel .close-drawer {
            color: #fff;
            font-size: 24px;
        }

        .drawer-stat {
            background: #1a1a1a;
            border: 2px solid #444;
        }

        .drawer-stat .stat-value {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .drawer-stat .stat-label {
            color: #aaa;
            font-size: 14px;
        }

        .audit-panel {
            background: #0d0d0d;
            color: #e0e0e0;
        }

        .audit-panel h3 {
            color: #fff;
            font-size: 18px;
        }

        .audit-panel .close-btn {
            color: #fff;
            font-size: 24px;
        }

        .audit-item {
            background: #1a1a1a;
            border: 2px solid #444;
            color: #e0e0e0;
            font-size: 14px;
        }

        .memory-panel {
            background: #0d0d0d;
            color: #e0e0e0;
        }

        .memory-panel h3 {
            color: #fff;
            font-size: 18px;
        }

        .memory-panel .close-btn {
            color: #fff;
            font-size: 24px;
        }

        .memory-item {
            background: #1a1a1a;
            border: 2px solid #444;
            color: #e0e0e0;

        }

        :root {
            --text-primary: #111;
            --text-secondary: #444;
            --text-muted: #777;
            --border-color: #ccc;
        }
    </style>
</head>

<body>

    <div class="intro-overlay" id="introOverlay">
        <div class="line">咻——</div>
        <div class="line">一道光从边缘划过，</div>
        <div class="line">光落处，浮出一行字：</div>
        <div class="line">"企业镜像已就绪。"</div>
        <button class="public-btn" id="enterPublicBtn">🏢 进入企业镜像</button>
        <div class="secret-trigger" id="secretTrigger">🔑 管理员通道</div>
    </div>

    <div id="appContainer">
        <div class="topbar">
            <div class="topbar-left">
                <div class="logo">藏器魂 <span>· 企业镜像</span></div>
            </div>
            <div class="topbar-right">
                <span class="gate-indicator" id="gateIndicator" title="当前阀门状态">⚪ 待命</span>
                <select class="model-select" id="modelSelect">
                    <option value="qwen3:4b" selected>本地模型 Qwen3:4B</option>
                    <option value="qwen3:1.5b">本地模型 Qwen3:1.5B</option>
                    <option value="qwen3:14b">本地模型 Qwen3:14B</option>
                    <option value="qwen3:32b">本地模型 Qwen3:32B</option>
                    <option value="deepseek-chat">DeepSeek Chat</option>
                    <option value="deepseek-reasoner">DeepSeek Reasoner</option>
                    <option value="bailian-chat">百炼 ChatGPT</option>
                    <option value="glm-4.7-flash">智谱 GLM-4.7-Flash</option>
                    <option value="qwq-32b">阿里 QwQ-32B</option>
                </select>
                <span class="token-display" id="tokenDisplay" onclick="openTokenDrawer()" title="点击查看Token详情">💰 0
                    Token</span>
            </div>
        </div>
        <div class="main-body">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span>分身</span>
                    <span class="badge">企业ID: CANGQI_001</span>
                </div>
                <div class="sidebar-list" id="convList"></div>
                <div class="sidebar-footer">🏢 企业镜像</div>
            </div>
            <div class="chat-area" id="chatArea"></div>
        </div>
        <div class="input-area">
            <button class="tool-btn" onclick="openFileExplorer()">📂 文件夹</button>
            <textarea id="userInput" rows="1" placeholder="输入您的话... (Enter发送)"></textarea>
            <button class="tool-btn" onclick="clearScreen()">🧹 清屏</button>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // ================================================================
        // 藏器魂 · 企业镜像分身系统 —— B系统（全血栓疏通版）
        // ================================================================
        const API_BASE = 'http://127.0.0.1:18889';

        // ===== 全局请求封装 =====
        async function apiGet(path) {
            const res = await fetch(API_BASE + path, { signal: AbortSignal.timeout(15000) });
            return res.json();
        }
        async function apiPost(path, body) {
            const res = await fetch(API_BASE + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: AbortSignal.timeout(30000)
            });
            return res.json();
        }

        const ENTERPRISE_ID = 'CANGQI_001';
        let messages = [];
        let currentConversationId = null;
        let conversations = {};
        let tokenUsed = parseInt(localStorage.getItem('tokenUsed') || '0');
        window._executionLogs = [];

        // ===== 阀门状态指示器 =====
        function updateGateIndicator(gate) {
            const indicator = document.getElementById('gateIndicator');
            if (!indicator) return;
            if (gate === 'local') {
                indicator.textContent = '🏠 本地';
                indicator.className = 'gate-indicator local';
            } else if (gate === 'cloud') {
                indicator.textContent = '☁️ 云端';
                indicator.className = 'gate-indicator cloud';
            } else {
                indicator.textContent = '⚪ 待命';
                indicator.className = 'gate-indicator';
            }
        }

        // ===== 心跳检测 =====
        async function checkBackendHealth() {
            try {
                const res = await apiGet('/api/health');
                return res.status === 'ok';
            } catch (e) { return false; }
        }
        setInterval(async function () {
            const alive = await checkBackendHealth();
            const badge = document.getElementById('modeBadge');
            if (badge) {
                badge.textContent = alive ? '企业模式' : '⚠️ 离线模式';
                badge.style.background = alive ? '#10a37f' : '#c0392b';
            }
        }, 30000);

        // ===== 审计落盘 =====
        window.flushAuditLog = async function () {
            if (!window._executionLogs || window._executionLogs.length === 0) return;
            const logPath = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\audit\\audit.log';
            const lines = window._executionLogs.map(function (log) {
                return JSON.stringify({
                    timestamp: log.timestamp || new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }),
                    executionPath: log.executionPath || 'unknown',
                    assetHit: log.assetHit || '无',
                    originalContent: (log.originalContent || '').slice(0, 200)
                });
            }).join('\n') + '\n';
            try {
                const data = await apiPost('/api/file/read', { path: logPath });
                const existing = data.success && data.content ? data.content : '';
                await apiPost('/api/file/write', { filePath: logPath, content: existing + lines });
                window._executionLogs = [];
            } catch (e) { console.warn('审计落盘失败:', e); }
        };

        // ===== 记忆系统 =====
        const memoryManager = {
            getMemoryPath: function () {
                let avatarName = currentConversationId || '傅王侯';
                if (!avatarName || avatarName === 'null' || avatarName === 'undefined') avatarName = '傅王侯';
                return 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\memory.json';
            },
            getPreferencesPath: function () {
                let avatarName = currentConversationId || '傅王侯';
                if (!avatarName || avatarName === 'null' || avatarName === 'undefined') avatarName = '傅王侯';
                return 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\preferences.json';
            },
            save: async function (entry) {
                try {
                    const memories = await this.loadAll();
                    memories.push({ id: 'mem_' + Date.now(), timestamp: new Date().toISOString(), role: entry.role || 'user', content: entry.content || '', sessionId: currentConversationId });
                    if (memories.length > 200) memories.splice(0, memories.length - 200);
                    await apiPost('/api/file/write', { filePath: this.getMemoryPath(), content: JSON.stringify(memories, null, 2) });
                } catch (e) {
                    const old = JSON.parse(localStorage.getItem('cangqihun_memory') || '[]');
                    old.push(entry);
                    localStorage.setItem('cangqihun_memory', JSON.stringify(old));
                }

        async function localRuleEngine(userInput, avatarName) {
            const ruleMap = [
                { keywords: ['采购合同', '采购', '供应商', '供货', '交货', '验收', '付款', '预付款', '审查合同', '审合同', '合同审查', '违约责任', '违约金', '争议', '管辖', '法院'], file: 'contract.json' },
                { keywords: ['清洗数据', '数据清洗', '整理数据', '清理表格', '去重', '格式整理'], file: 'clean.json' },
                { keywords: ['审计', '审计日志', '追溯', '操作记录'], file: 'audit.json' }
            ];
            const basePath = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\soul\\rules\\';
            let targetFile = null;
            for (let i = 0; i < ruleMap.length; i++) {
                for (let j = 0; j < ruleMap[i].keywords.length; j++) {
                    if (userInput.includes(ruleMap[i].keywords[j])) { targetFile = ruleMap[i].file; break; }
                }
                if (targetFile) break;
            }
            if (!targetFile) return null;
            try {
                const data = await apiPost('/api/file/read', { path: basePath + targetFile });
                if (!data.success || !data.content) return null;
                const rules = JSON.parse(data.content).rules || [];
                let hitRules = [];
                for (let i = 0; i < rules.length; i++) {
                    if (!rules[i].keywords) continue;
                    for (let j = 0; j < rules[i].keywords.length; j++) {
                        if (userInput.includes(rules[i].keywords[j])) {
                            hitRules.push({
                                name: rules[i].name,
                                response: rules[i].response,
                                keyword: rules[i].keywords[j],

        // ========== 生成网络监控证据 ==========
        async function generateNetworkEvidence() {
            const capturePath = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\capture\\capture.log';
            let evidence = {
                hasCapture: false,
                timeStart: '',
                timeEnd: '',
                totalPackets: 0,
                publicIPs: [],
                hasPublicTraffic: false,
                summary: ''
            };

            try {
                const data = await apiPost('/api/file/read', { path: capturePath });
                if (!data.success || !data.content) {
                    evidence.summary = '⚠️ 抓包日志不存在，请确认抓包工具已运行。';
                    return evidence;
                }

                const lines = data.content.split('\n').filter(l => l.trim() && !l.startsWith('frame.time'));
                if (lines.length === 0) {
                    evidence.summary = '⚠️ 抓包日志为空，未捕获到任何网络流量。';
                    return evidence;
                }

                evidence.hasCapture = true;
                evidence.totalPackets = lines.length;
                evidence.timeStart = lines[0].split(',')[0] || '';
                evidence.timeEnd = lines[lines.length - 1].split(',')[0] || '';

                const publicIPs = new Set();
                const privatePrefixes = ['127.', '192.168.', '10.', '172.16.', '172.17.', '172.18.', '172.19.', '172.20.', '172.21.', '172.22.', '172.23.', '172.24.', '172.25.', '172.26.', '172.27.', '172.28.', '172.29.', '172.30.', '172.31.', '0.0.0.0'];

                lines.forEach(line => {
                    const parts = line.split(',');
                    // CSV格式: frame.time, ip.src, ip.dst, frame.len
                    // 索引0: 时间, 索引1: 源IP, 索引2: 目标IP, 索引3: 长度
                    if (parts.length >= 4) {
                        const dstIP = parts[2] ? parts[2].trim() : '';
                        if (dstIP && dstIP !== '' && dstIP !== '0.0.0.0') {
                            let isPrivate = false;
                            for (let i = 0; i < privatePrefixes.length; i++) {
                                if (dstIP.startsWith(privatePrefixes[i])) {
                                    isPrivate = true;
                                    break;
                                }
                            }
                            if (!isPrivate) {
                                publicIPs.add(dstIP);
                            }
                        }
                    }
                });

                evidence.publicIPs = Array.from(publicIPs);
                evidence.hasPublicTraffic = publicIPs.size > 0;

                let summary = '📊 抓包时间: ' + evidence.timeStart + ' 至 ' + evidence.timeEnd + '\n';
                summary += '📦 数据包总数: ' + evidence.totalPackets + ' 条\n';
                if (evidence.publicIPs.length > 0) {
                    summary += '🌐 目标IP列表: ' + evidence.publicIPs.join(', ') + '\n';
                    summary += '⚠️ 公网访问记录: 是（存在公网IP访问）\n';
                    summary += '❌ 结论: 处理期间存在公网流量，数据可能出域。';
                } else {
                    summary += '✅ 公网访问记录: 否（仅内网/本地流量）\n';
                    summary += '✅ 结论: 数据未出域，符合安全合规要求。';
                }
                evidence.summary = summary;
                return evidence;

            } catch (e) {
                evidence.summary = '❌ 读取抓包日志失败: ' + e.message;
                return evidence;
            }
        }

        // ========== 数据清洗调度 ==========
        async function cleanDispatch(userInput, fileContent, filePath, avatarName) {
            console.log('userInput:', userInput);
            console.log('fileMatch:', userInput.match(/([A-Za-z]:\\.*\.(csv|xlsx|txt))/i));
            const fileMatch = userInput.match(/([A-Za-z]:\\.*\.(csv|xlsx|txt))/i);
            if (!fileMatch && !fileContent) {
                addMessage('system', '📌 请指定要清洗的数据文件，如：数据清洗 C:\\数据\\客户数据.csv\n或点击 📂 上传文件');
                return;
            }
            const cleanPath = fileMatch ? fileMatch[1] : filePath;
            addMessage('system', '🔍 正在清洗数据...');
            try {
                let content = fileContent;
                if (!content) {
                    const data = await apiPost('/api/file/read', { path: cleanPath });
                    if (!data.success || !data.content) { addMessage('system', '❌ 文件读取失败'); return; }
                    content = data.content;
                }
                const lines = content.split('\n').filter(l => l.trim());
                let cleanLines = [lines[0]];
                const totalRows = lines.length - 1;
                let dupCount = 0, emptyCount = 0, desenCount = 0;
                const seen = {};
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) { emptyCount++; continue; }
                    if (seen[line]) { dupCount++; continue; }
                    seen[line] = true;
                    const fields = line.split(',');
                    const cleaned = fields.map(f => {
                        let val = f.trim();
                        if (/^\d{11}$/.test(val)) { desenCount++; return val.slice(0, 3) + '****' + val.slice(-4); }
                        if (/^\d{17}[\dXx]$/.test(val)) { desenCount++; return val.slice(0, 6) + '********' + val.slice(-4); }
                        return val;
                    }).join(',');
                    cleanLines.push(cleaned);

                }
                let resultText = '【数据清洗报告】\n\n' +
                    '📊 原始数据：' + totalRows + ' 行\n' +
                    '✅ 有效数据：' + (totalRows - dupCount - emptyCount) + ' 行\n' +
                    '🗑️  去重：' + dupCount + ' 条\n' +
                    '📭 空行：' + emptyCount + ' 条\n' +
                    '🔒 脱敏字段：' + desenCount + ' 个（手机号/身份证号）\n\n' +
                    '🏠 本清洗在本地完成，数据未联网。';
                const savePath = cleanPath.replace(/\.(csv|xlsx|txt)$/i, '_已清洗.csv');
                const cleanContent = cleanLines.join('\n');
                await apiPost('/api/file/write', { filePath: savePath, content: cleanContent });
                resultText += '\n\n💾 清洗结果已保存至: ' + savePath;
                addMessage('assistant', resultText);
                window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'local', assetHit: '数据清洗', originalContent: userInput });
                try { await flushAuditLog(); } catch (e) { }
            } catch (e) { addMessage('system', '❌ 清洗失败: ' + e.message); }
        }
        // ========== 新增规则调度 ==========
        async function addRuleDispatch(userInput, avatarName) {
            const match = userInput.match(/新增规则\s*(.+?)\s*关键词[:：]\s*(.+?)\s*建议[:：]\s*(.+)/);
            if (!match) {
                addMessage('system', '📌 格式：新增规则 规则名称 关键词:词1,词2 建议:审查建议内容');
                return;
            }
            const ruleName = match[1].trim();
            const keywords = match[2].split(/[,，]/).map(function (k) { return k.trim(); });
            const response = match[3].trim();
            const filePath = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\soul\\rules\\contract.json';
            try {
                const data = await apiPost('/api/file/read', { path: filePath });
                if (!data.success || !data.content) { addMessage('system', '❌ 规则文件读取失败'); return; }
                const rulesObj = JSON.parse(data.content);
                rulesObj.rules.push({
                    id: 'custom_' + Date.now(),
                    name: ruleName,
                    keywords: keywords,
                    confidence: 0.8,
                    response: '【自定义规则】' + response
                });
                await apiPost('/api/file/write', { filePath: filePath, content: JSON.stringify(rulesObj, null, 2) });
                addMessage('assistant', '✅ 规则已添加: ' + ruleName + '\n关键词: ' + keywords.join('、') + '\n建议: ' + response + '\n\n📁 已保存至: contract.json');
                window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'local', assetHit: '新增规则', originalContent: userInput });
                try { await flushAuditLog(); } catch (e) { }
            } catch (e) { addMessage('system', '❌ 添加失败: ' + e.message); }
        }

        // ========== 文件查看调度 ==========
        async function fileQueryDispatch(userInput, avatarName) {
            const fileMatch = userInput.match(/(\S+\.json)/);
            if (!fileMatch) { addMessage('system', '📌 请指定文件名，如：查看文件 contract.json'); return; }
            const fileName = fileMatch[1];
            const rulesDir = 'C:\\cangqihun_enterprise\\enterprises\\CANGQI_001\\avatars\\' + avatarName + '\\soul\\rules\\';
            const filePath2 = rulesDir + fileName;
            try {
                const data = await apiPost('/api/file/read', { path: filePath2 });
                if (data.success && data.content) {
                    addMessage('assistant', '【文件内容】' + fileName + '\n\n' + data.content.substring(0, 5000));
                } else {
                    addMessage('system', '❌ 文件不存在或为空: ' + fileName);
                }
            } catch (e) { addMessage('system', '❌ 读取失败: ' + e.message); }
        }
        // ================================================================
        // 网络感知 + 本地模型自动调度（独立函数）
        // ================================================================

        async function isOllamaRunning() {
            try {
                const res = await fetch('http://127.0.0.1:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'qwen3:4b', prompt: 'ping', stream: false }),
                    signal: AbortSignal.timeout(3000)
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        async function checkNetworkStatus() {
            try {
                const res = await fetch('http://127.0.0.1:18889/api/health', {
                    signal: AbortSignal.timeout(3000)
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        function startOllamaProcess() {
            fetch('http://127.0.0.1:18889/api/system/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: 'start /B ollama serve' })
            }).catch(() => { });
        }

        function stopOllamaProcess() {
            fetch('http://127.0.0.1:18889/api/system/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: 'taskkill /f /im ollama.exe' })
            }).catch(() => { });
        }

        async function ensureOllamaReady() {
            const modelRunning = await isOllamaRunning();
            const online = await checkNetworkStatus();
            if (!online && !modelRunning) {
                addMessage('system', '🌐 网络已断开，自动启动本地模型...');
                startOllamaProcess();
                return true;
            }
            if (online && modelRunning) {
                stopOllamaProcess();
                return false;
            }
            return modelRunning;
        }

        function enforceLocalOnly() {
            if (typeof process !== 'undefined' && process.env) {
                process.env.OPENCLAW_PROVIDER = 'ollama';
                process.env.OPENCLAW_API_URL = 'http://127.0.0.1:11434';
                process.env.OPENCLAW_ALLOW_CLOUD = 'false';
                process.env.OPENCLAW_ALLOW_EXTERNAL = 'false';
            }
            window._executionLogs = window._executionLogs || [];
            window._executionLogs.push({
                timestamp: new Date().toISOString(),
                executionPath: 'system',
                assetHit: '强制本地化环境变量已注入',
                originalContent: 'OpenClaw 联网能力已封禁'
            });
        }

        // ========== 主权调度（精简为路由器） ==========
        async function sovereignDispatch(userInput) {
            // === 硬实力：强制外部工具本地化 + 网络感知自动调度 ===
            enforceLocalOnly();
            await ensureOllamaReady();


            let fileContent = '', filePath = '';
            const avatarName = currentConversationId || '傅王侯';

            if (window._pickedFileContent) {
                fileContent = window._pickedFileContent;
                filePath = window._pickedFilePath || '已选文件';
                addMessage('system', '📂 使用已选文件: ' + filePath + '（' + fileContent.length + ' 字符）');
                window._pickedFileContent = '';
                window._pickedFilePath = '';
                window._pickedFile = null;
            }

            // 路由器：按关键词分发到独立调度函数
            if (/新增规则|添加规则|自定义规则/.test(userInput)) { await addRuleDispatch(userInput, avatarName); return; }
            if (/数据清洗|清洗数据|数据清理|清理数据/.test(userInput)) {
                await cleanDispatch(userInput, fileContent, filePath, avatarName);
                await generateAuditReport('数据清洗', '清洗完成', userInput);
                return;
            }
            if (/查看文件|打开文件|文件内容/.test(userInput)) { await fileQueryDispatch(userInput, avatarName); return; }
            if (/查询规则|查看规则|规则是什么|规则内容/.test(userInput)) { await ruleQueryDispatch(userInput, avatarName); return; }
            if (/审查合同|审查|帮我审核|审核合同|审一下|帮我看看|我要审查/.test(userInput)) {
                await reviewDispatch(userInput, fileContent, avatarName);
                await generateAuditReport('合同审查', '审查完成', userInput);
                return;

            }

            // 文件路径检测
            const filePathMatch = userInput.match(/([A-Za-z]:\\[^\\s]*\.(txt|docx|xlsx|pdf|doc))/i);
            if (filePathMatch) {
                try {
                    const readData = await apiPost('/api/file/read', { path: filePathMatch[1] });
                    if (readData.success && readData.content) {
                        fileContent = readData.content;
                        addMessage('system', '✅ 文件读取成功，共 ' + fileContent.length + ' 字符');
                    }
                } catch (e) { addMessage('system', '⚠️ 文件读取失败: ' + e.message); }
            }

            // 规则引擎兜底
            const searchText = fileContent ? userInput + ' ' + fileContent : userInput;
            const ruleResult = await localRuleEngine(searchText, avatarName);
            if (ruleResult) {
                const confirmed = await showResultPreview(ruleResult.result, ruleResult.sourceFile);
                if (confirmed) { await saveResultToFile(ruleResult.result, ruleResult.sourceFile, 'txt'); }
                addMessage('assistant', ruleResult.result);
                window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'local', assetHit: ruleResult.assetName, originalContent: userInput });
                try { await flushAuditLog(); } catch (e) { }
                return;
            }

            // 联网兜底
            addMessage('system', '📌 本地规则引擎未命中该任务。');
            const shouldOnline = suggestOnlineMode(userInput);
            if (!shouldOnline) { addMessage('system', '📌 您选择不联网，任务已结束。'); return; }
            addMessage('system', '🤔 正在思考...');
            const desensitizedContent = fileContent ? desensitizeData(fileContent) : '';
            const promptText = desensitizedContent ? userInput + '\n\n【脱敏后的文件内容】\n' + desensitizedContent : userInput + '\n\n【文件内容】\n' + (fileContent || '').slice(0, 3000);
            const reply = await getAIResponse(promptText);
            document.querySelectorAll('.message.system').forEach(el => { if (el.textContent.includes('正在思考...')) el.remove(); });
            const aiConfirmed = await showResultPreview(reply, 'ai.json');
            if (aiConfirmed) await saveResultToFile(reply);
            addMessage('assistant', reply);
            window._executionLogs.push({ timestamp: new Date().toISOString(), executionPath: 'cloud', assetHit: '无（联网处理）', originalContent: userInput, fileContent: fileContent.slice(0, 500) });
            await memoryManager.save({ role: 'user', content: userInput });
            await memoryManager.save({ role: 'assistant', content: reply });
            try { await flushAuditLog(); } catch (e) { }

        }

        async function saveResultToFile(content, sourceFile) {
            try {
                const folderHandle = await window.showDirectoryPicker();
                const fileName = (sourceFile === 'clean.json' ? '清洗结果_' : '报告_') + Date.now() + (sourceFile === 'clean.json' ? '.csv' : '.txt');
                const fileHandle = await folderHandle.getFileHandle(fileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();
                addMessage('system', '✅ 结果已保存到: ' + folderHandle.name + '\\' + fileName);
            } catch (e) {
                const fallbackPath = window.prompt('请手动输入完整保存路径（含文件名）：', 'C:\\cangqihun_enterprise\\outputs\\报告_' + Date.now() + '.txt');
                if (fallbackPath && fallbackPath.trim() !== '') {
                    try {
                        await apiPost('/api/file/write', { filePath: fallbackPath, content });
                        addMessage('system', '✅ 结果已保存到: ' + fallbackPath);
                    } catch (err) { addMessage('system', '❌ 保存失败: ' + err.message); }
                }
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;
            input.value = '';
            addMessage('user', rawText);

            const isRuleQuery = /查询规则|查看规则|规则是什么|规则内容/.test(rawText);
            const isFileQuery = /查看文件|打开文件|文件内容/.test(rawText);
            const isAddRule = /新增规则|添加规则|自定义规则/.test(rawText);

            if (isRuleQuery || isFileQuery || isAddRule) {
                await sovereignDispatch(rawText);
                return;
            }
            if (isRuleQuery || isFileQuery) {
                await sovereignDispatch(rawText);
                return;
            }

            const isTaskKeyword = /审查|清洗|审计|审核|审合同|帮我|我要|看看|审一下/.test(rawText);
            const interactionRecord = {
                timestamp: new Date().toISOString(),
                userInput: rawText,
                isTaskKeyword,
                intent: 'unknown',
                confirmed: false,
                result: null
            };

            if (isTaskKeyword) {
                const skipConfirm = learner.shouldSkipConfirm(rawText);
                let confirmed = true;
                if (!skipConfirm) {
                    confirmed = await showConfirmDialog('📌 检测到任务指令，是否进入「藏器魂」任务调度？', '是，执行任务', '否，普通对话');
                } else {
                    console.log('📚 学习容器判断：跳过反问，自动进入任务调度');
                }
                interactionRecord.confirmed = confirmed;

                if (!confirmed) {
                    const reply = await getAIResponse(rawText);
                    addMessage('assistant', reply);
                    interactionRecord.intent = 'chat';
                    interactionRecord.result = reply;
                    await learner.record(interactionRecord);
                    return;
                }
                interactionRecord.intent = 'task';
                await sovereignDispatch(rawText);
                interactionRecord.result = 'task_executed';
                await learner.record(interactionRecord);
                return;
            }

            const reply = await getAIResponse(rawText);
            addMessage('assistant', reply);
            interactionRecord.intent = 'chat';
            interactionRecord.result = reply;
            await learner.record(interactionRecord);
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', async function () {
            console.log('🏢 企业镜像系统初始化...');
            // 添加记忆和审计按钮到顶部栏
            var topbarRight = document.querySelector('.topbar-right');
            if (topbarRight) {
                var memBtn = document.createElement('button');
                memBtn.className = 'header-btn';
                memBtn.textContent = '🧠 记忆';
                memBtn.onclick = openMemoryPanel;
                var auditBtn = document.createElement('button');
                auditBtn.className = 'header-btn';
                auditBtn.textContent = '📋 审计';
                auditBtn.onclick = openAuditPanel;
                topbarRight.insertBefore(auditBtn, topbarRight.firstChild);
                topbarRight.insertBefore(memBtn, topbarRight.firstChild);
            }
            // 恢复 Token 显示
            const savedTokens = parseInt(localStorage.getItem('tokenUsed') || '0');
            if (savedTokens > 0) {
                tokenUsed = savedTokens;
                document.getElementById('tokenDisplay').textContent = '💰 ' + tokenUsed.toLocaleString() + ' Token';
            }
            // 同步阀门策略
            await learner.sync();

            try {
                const data = await apiGet('/api/avatars/list');
                if (data.success && data.avatars.length > 0) {
                    data.avatars.forEach(name => {
                        if (!conversations[name]) conversations[name] = {
                            id: name, messages: [], title: name,
                            windowIdentity: name
                        };
                    });
                    console.log('✅ 已加载分身:', data.avatars.join(', '));
                } else {
                    conversations['傅王侯'] = { id: '傅王侯', messages: [], title: '傅王侯', windowIdentity: '傅王侯' };
                }
                localStorage.setItem('ruling_conversations', JSON.stringify(conversations));
            } catch (e) {
                const saved = localStorage.getItem('ruling_conversations');
                if (saved) { try { conversations = JSON.parse(saved); } catch (e2) { } }
            }

            const savedId = localStorage.getItem('ruling_current_conv_id');
            if (savedId && conversations[savedId]) {
                currentConversationId = savedId;
                messages = conversations[savedId].messages || [];
            } else {
                const firstId = Object.keys(conversations)[0];
                if (firstId) {
                    currentConversationId = firstId;
                    messages = conversations[firstId].messages || [];
                    localStorage.setItem('ruling_current_conv_id', currentConversationId);
                }
            }

            renderConversationList();
            clearChatArea();
            restoreChatArea();
            document.getElementById('introOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            console.log('🎉 企业镜像系统就绪');

            document.getElementById('userInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            document.getElementById('enterPublicBtn').onclick = function () {
                document.getElementById('introOverlay').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
            };
            document.getElementById('secretTrigger').onclick = function () {
                if (prompt('请输入管理员口令：', '') === 'cangqihun') {
                    document.getElementById('introOverlay').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                } else { alert('口令错误'); }
            };
        });
    </script>
