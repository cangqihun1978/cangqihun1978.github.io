<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如律令</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-card: #2a2a2a;
            --bg-hover: #333333;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6a6a6a;
            --border-color: #3a3a3a;
            --accent: #10a37f;
            --accent-hover: #1a7a64;
            --radius: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: "KaiTi", "楷体", "PingFang SC", system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header .badge {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            max-height: calc(100vh - 120px);
        }

        .sidebar-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent);
            color: var(--text-primary);
        }

        .sidebar-item .icon {
            font-size: 16px;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .main-container {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            height: 56px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .header-left .logo span {
            color: var(--text-muted);
            font-weight: normal;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mode-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-badge .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            transition: background 0.3s ease;
        }

        .mode-badge.public .status-dot {
            background: #555;
        }

        .mode-badge.sovereign .status-dot {
            background: #10a37f;
        }

        .mode-badge.sovereign {
            border-color: #7a8a6a;
            color: #7a8a6a;
        }

        .mode-badge:hover {
            background: var(--border-color);
        }

        .header-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .header-btn.save-btn {
            border-color: #7a8a6a;
            color: #7a8a6a;
        }

        .header-btn.save-btn:hover {
            background: #7a8a6a22;
        }

        .header-btn.load-btn {
            border-color: #5a7a8a;
            color: #5a7a8a;
        }

        .header-btn.load-btn:hover {
            background: #5a7a8a22;
        }

        .header-btn.memory-btn {
            border-color: #8a7a5a;
            color: #8a7a5a;
        }

        .header-btn.memory-btn:hover {
            background: #8a7a5a22;
        }

        .header-btn.audit-btn {
            border-color: #7a5a8a;
            color: #7a5a8a;
        }

        .header-btn.audit-btn:hover {
            background: #7a5a8a22;
        }

        .model-select {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .model-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .token-display {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: var(--bg-primary);
        }

        .chat-area .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .chat-area .message.system {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 6px 0;
            margin-bottom: 12px;
        }

        .chat-area .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .chat-area .message.user .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px 12px 4px 12px;
            max-width: 75%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .chat-area .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .chat-area .message.assistant .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px 12px 12px 4px;
            max-width: 85%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .chat-area .message.assistant .bubble p {
            margin: 6px 0;
        }

        .chat-area .message.assistant .bubble ul,
        .chat-area .message.assistant .bubble ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .input-area {
            padding: 12px 24px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .input-area .send-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
        }

        .input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        .input-area .tool-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            height: 44px;
        }

        .input-area .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        .sovereign-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }

        .sovereign-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow);
        }

        .sovereign-modal-content h3 {
            margin-bottom: 16px;
            text-align: center;
            font-size: 20px;
        }

        .sovereign-modal-content .challenge-item {
            font-size: 18px;
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 6px;
            letter-spacing: 2px;
        }

        .sovereign-modal-content .challenge-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            margin-top: 12px;
            outline: none;
        }

        .sovereign-modal-content .challenge-input:focus {
            border-color: var(--accent);
        }

        .sovereign-modal-content .error-msg {
            color: #cc5544;
            font-size: 13px;
            margin-top: 6px;
            min-height: 20px;
        }

        .sovereign-modal-content button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            margin-right: 8px;
            font-weight: bold;
        }

        .sovereign-modal-content button:hover {
            background: var(--accent-hover);
        }

        .sovereign-modal-content button:last-child {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .sovereign-modal-content button:last-child:hover {
            background: var(--bg-hover);
        }

        .mode-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 160px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 50;
        }

        .mode-menu .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: background 0.2s;
        }

        .mode-menu .menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .mode-menu .menu-item .highlight {
            color: var(--accent);
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .intro-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-overlay .line {
            font-size: 24px;
            color: var(--text-primary);
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            margin: 6px 0;
        }

        .intro-overlay .line:nth-child(1) {
            animation-delay: 0s;
        }

        .intro-overlay .line:nth-child(2) {
            animation-delay: 0.6s;
        }

        .intro-overlay .line:nth-child(3) {
            animation-delay: 1.2s;
        }

        .intro-overlay .line:nth-child(4) {
            animation-delay: 1.8s;
        }

        .intro-overlay .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--text-primary);
            animation: blink 1s infinite;
            margin-left: 4px;
        }

        .intro-overlay .public-btn {
            margin-top: 40px;
            padding: 14px 40px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: transparent;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .intro-overlay .public-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }

        .intro-overlay .secret-trigger {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px dotted var(--text-muted);
        }

        .intro-overlay .secret-trigger:hover {
            color: var(--text-secondary);
        }

        .memory-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 500px;
            max-width: 90vw;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 24px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .memory-panel .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .memory-panel .memory-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .memory-panel .memory-item .time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .memory-panel .memory-item .role {
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
        }

        .memory-panel .memory-item .content {
            color: var(--text-primary);
            font-size: 14px;
            margin-top: 4px;
        }

        .audit-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 600px;
            max-width: 92vw;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 24px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .audit-panel .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .audit-panel .audit-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .audit-panel .audit-item .time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .audit-panel .audit-item .detail {
            color: var(--text-secondary);
            margin-top: 4px;
            word-break: break-all;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .sidebar-list::-webkit-scrollbar {
            width: 3px;
        }

        @media (max-width: 640px) {
            .sidebar {
                transform: translateX(-100%);
                width: 200px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-container {
                margin-left: 0;
            }

            .header {
                padding: 8px 12px;
                flex-wrap: wrap;
                height: auto;
                gap: 6px;
            }

            .header-right {
                flex-wrap: wrap;
                gap: 6px;
            }

            .chat-area {
                padding: 16px;
            }

            .input-area {
                padding: 8px 12px 16px;
                flex-wrap: wrap;
            }

            .input-area textarea {
                min-height: 36px;
                font-size: 14px;
            }

            .input-area .send-btn {
                padding: 8px 16px;
                font-size: 14px;
                height: 38px;
            }

            .input-area .tool-btn {
                padding: 8px 12px;
                font-size: 12px;
                height: 38px;
            }

            .intro-overlay .line {
                font-size: 18px;
            }

            .sovereign-modal-content {
                padding: 24px 20px;
            }

            .model-select {
                font-size: 12px;
                padding: 2px 8px;
                max-width: 100px;
            }

            .token-display {
                font-size: 11px;
                padding: 2px 8px;
            }

            .header-btn {
                font-size: 11px;
                padding: 4px 10px;
            }

            .header-left .logo {
                font-size: 15px;
            }

            .memory-panel {
                width: 100vw;
                max-width: 100vw;
            }

            .audit-panel {
                width: 100vw;
                max-width: 100vw;
            }
        }

        @media (max-width: 480px) {
            .header-right .header-btn {
                font-size: 10px;
                padding: 3px 8px;
            }

            .token-display {
                font-size: 10px;
                padding: 2px 6px;
            }

            .chat-area .message.assistant .bubble {
                max-width: 92%;
                font-size: 14px;
            }

            .chat-area .message.user .bubble {
                max-width: 85%;
                font-size: 14px;
            }
        }
    </style>
</head>

        function saveData() {
            const stateData = {
                windowKey: WINDOW_KEY,
                currentMode: currentMode,
                messages: messages,
                tokenUsed: tokenUsed,
                preferences: { model: document.getElementById('modelSelect').value, fiveStandards: true },
                lastSettled: new Date().toISOString()
            };
            try {
                if (window.showDirectoryPicker) {
                    window.showDirectoryPicker().then(handle => {
                        const fileName = WINDOW_KEY + '_state_' + new Date().toISOString().slice(0, 10) + '.json';
                        handle.getFileHandle(fileName, { create: true }).then(fileHandle => {
                            fileHandle.createWritable().then(writable => {
                                writable.write(JSON.stringify(stateData, null, 2));
                                writable.close();
                                addMessage('system', '✅ 窗口 "' + WINDOW_NAME + '" 已保存。');
                            });
                        });
                    }).catch(() => {
                        downloadFallback(stateData);
                    });
                } else {
                    downloadFallback(stateData);
                }
            } catch (e) {
                downloadFallback(stateData);
            }
        }

        function downloadFallback(stateData) {
            const blob = new Blob([JSON.stringify(stateData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = WINDOW_KEY + '_state_' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            addMessage('system', '✅ 窗口 "' + WINDOW_NAME + '" 已保存到下载目录。');
        }

        function loadData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function (e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.windowKey && data.windowKey === WINDOW_KEY) {
                            if (data.messages && Array.isArray(data.messages)) {
                                messages = data.messages;
                                if (data.currentMode) currentMode = data.currentMode;
                                if (data.tokenUsed) tokenUsed = data.tokenUsed;
                                updateModeBadge();
                                restoreChatArea();
                                addMessage('system', '✅ 窗口 "' + WINDOW_KEY + '" 已成功唤醒。');
                            } else {
                                addMessage('system', '❌ 封地文件格式不正确。');
                            }
                        } else {
                            addMessage('system', '❌ 此封地文件不属于窗口 "' + WINDOW_KEY + '"。');
                        }
                    } catch (e) {
                        addMessage('system', '❌ 文件解析失败。');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function selectFile() {
            return new Promise((resolve) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.txt,.docx,.xlsx,.pdf,.doc';
                input.onchange = (e) => {
                    if (e.target.files.length > 0) {
                        const file = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            resolve({
                                path: file.name,
                                content: event.target.result,
                                size: file.size,
                                type: file.type,
                                originalFile: file
                            });
                        };
                        reader.readAsArrayBuffer(file);
                    } else {
                        resolve(null);
                    }
                };
                input.click();
            });
        }

        function parseIntent(userInput) {
            let result = {
                intentType: 'unknown',
                toolId: null,
                confidence: 0.3,
                params: {},
                taskDirection: null,   // contract: text_format / legal_risk
                isComplete: false,
                networkRequired: false,
                missingFields: []
            };

            const input = userInput.toLowerCase();

            // === 能力询问类指令 ===
            const capabilityWords = ['你会不会', '能不能', '行不行', '可以吗', '怎么给你', '能找到'];
            for (const word of capabilityWords) {
                if (input.includes(word)) {
                    result.intentType = 'capability_confirm';
                    return result;
                }
            }

            // === 闲聊类指令 ===
            const chatWords = ['聊天', '吹牛', '打发时间', '无聊', '陪你聊', '说话'];
            for (const word of chatWords) {
                if (input.includes(word)) {
                    result.intentType = 'chat';
                    return result;
                }
            }

            // === 工具识别 ===
            let matchedToolId = null;
            let maxScore = 0;

            for (const [toolId, rule] of Object.entries(intentMap)) {
                let score = 0;
                for (const kw of rule.keywords) {
                    if (input.includes(kw)) score += 0.3;
                }
                for (const fuzzy of rule.fuzzy) {
                    if (userInput.includes(fuzzy) || fuzzy.includes(userInput)) {
                        score += 0.5;
                        break;
                    }
                }
                if (score > maxScore) {
                    maxScore = score;
                    matchedToolId = toolId;
                }
            }

            if (matchedToolId && maxScore >= 0.5) {
                result.toolId = matchedToolId;
                result.intentType = 'tool_call';
                result.confidence = Math.min(maxScore, 0.95);
                result.params = { ...intentMap[matchedToolId].template };

                // === 提取文件路径（检查用户输入中是否包含 D:\\ 或 C:\\ 等盘符）===
                const pathMatch = userInput.match(/([A-Za-z]:\[^\s]*)/);
                if (pathMatch) {
                    result.params.path = pathMatch[1];
                }

                // === 判断任务方向（contract 专用）===
                if (matchedToolId === 'T002') {
                    if (input.includes('法律') || input.includes('风险') || input.includes('合规') || input.includes('核对')) {
                        result.taskDirection = 'legal_risk';
                        result.networkRequired = !navigator.onLine; // 断网时强制标记为需要联网
                    } else if (input.includes('文本') || input.includes('格式') || input.includes('关键词') || input.includes('扫描')) {
                        result.taskDirection = 'text_format';
                        result.networkRequired = false;
                    } else {
                        // 默认：文本格式合规（本地可执行）
                        result.taskDirection = 'text_format';
                        result.networkRequired = false;
                    }
                }

                // === 判断是否完整（有路径）===
                if (result.params.path && result.params.path.trim() !== '') {
                    result.isComplete = true;
                } else {
                    result.isComplete = false;
                    result.missingFields.push('path');
                }
            } else if (matchedToolId && maxScore >= 0.3 && maxScore < 0.5) {
                result.intentType = 'clarify';
                result.toolId = matchedToolId;
                result.missingFields = ['direction'];
            } else {
                result.intentType = 'clarify';
                result.missingFields = ['direction', 'path'];
            }

            return result;
        }

        function validateToolParams(toolId, params) {
            const required = { 'T001': ['path'], 'T002': ['path'], 'T003': ['command'], 'T004': ['command'] };
            const requiredFields = required[toolId] || [];
            for (const field of requiredFields) {
                const value = params[field] || '';
                if (!value || value.trim() === '') {
                    const toolName = { 'T001': '数据清洗', 'T002': '合同审查', 'T003': '文件管理', 'T004': '系统命令' }[toolId] || '操作';
                    return { valid: false, message: `请提供文件路径，我才能帮您${toolName}。` };
                }
                if (value.includes('测试') || value.includes('test') || value.includes('示例')) {
                    return { valid: false, message: `请提供真实的文件路径。` };
                }
            }
            return { valid: true };
        }

        function getIntentOptions(userInput) {
            const options = [];
            const input = userInput.toLowerCase();
            for (const [toolId, rule] of Object.entries(intentMap)) {
                for (const kw of rule.keywords) {
                    if (input.includes(kw)) {
                        options.push({ toolId: toolId, label: rule.fuzzy[0] || '执行 ' + toolId });
                        break;
                    }
                }
            }
            return options.slice(0, 3);
        }

                    addMessage('user', userText);
                    await executeTool(intent.toolId, intent.params);
                    window._pendingIntent = null;
                    window._pendingUserText = null;
                    return;
                }
                // 如果没有待执行任务，走正常对话
                addMessage('user', rawText);
                addMessage('system', '咻——让我想想...');
                const reply = await getAIResponse(rawText);
                document.querySelectorAll('.message.system').forEach(el => {
                    if (el.textContent.includes('咻——让我想想...')) el.remove();
                });
                addMessage('assistant', reply);
                if (currentMode === 'private') {
                    messages.push({ role: 'user', text: rawText });
                    messages.push({ role: 'assistant', text: reply });
                    localStorage.setItem('ruling_history', JSON.stringify(messages));
                }
                return;
            }

            if (rawText === '否' || rawText === 'no' || rawText === '取消') {
                if (window._pendingIntent) {
                    addMessage('system', '📌 已取消执行。');
                    window._pendingIntent = null;
                    window._pendingUserText = null;
                    return;
                }
                addMessage('system', '📌 已取消。如需继续，请发送新指令。');
                return;
            }

            // ============================================================
            // 第二步：处理“选择审查方向”（contract 专用）
            // ============================================================
            if (window._pendingDirection) {
                const choice = parseInt(rawText);
                if (choice === 1) {
                    window._pendingDirection = false;
                    window._pendingTaskDirection = 'text_format';
                    addMessage('system', '📌 请提供文件路径。示例：D:\\\\合同\\\\合作协议.docx');
                    return;
                } else if (choice === 2) {
                    window._pendingDirection = false;
                    window._pendingTaskDirection = 'legal_risk';
                    addMessage('system', '📌 请提供文件路径。示例：D:\\\\合同\\\\合作协议.docx');
                    return;
                } else {
                    addMessage('system', '📌 请回复数字 1（文本格式合规）或 2（法律风险核对）。');
                    return;
                }
            }

            // ============================================================
            // 第三步：处理“下一步选项”（任务完成后）
            // ============================================================
            if (window._waitingNextStep) {
                const choice = parseInt(rawText);
                if (choice === 1) {
                    window._waitingNextStep = false;
                    addMessage('system', '📌 请输入“审查合同”开始新任务。');
                    return;
                } else if (choice === 2) {
                    window._waitingNextStep = false;
                    addMessage('system', '📌 请输入“数据清洗”开始新任务。');
                    return;
                } else if (choice === 3) {
                    window._waitingNextStep = false;
                    openAuditPanel();
                    return;
                } else if (choice === 4) {
                    window._waitingNextStep = false;
                    addMessage('system', '📌 对话结束。如需继续，请发送新指令。');
                    return;
                } else {
                    addMessage('system', '📌 请回复数字 1、2、3 或 4 选择。');
                    return;
                }
            }

            // ============================================================
            // 第四步：意图识别 + 分步引导
            // ============================================================
            // 先检查是否涉及合同相关任务（包含关键词但不以 /tool 开头）
            const isContractRelated = rawText.includes('合同') || rawText.includes('审查') || rawText.includes('审核');
            const isDataRelated = rawText.includes('数据') || rawText.includes('清洗') || rawText.includes('去重');

            // ---- 如果是普通对话（无任务关键词）----
            if (!isContractRelated && !isDataRelated && !rawText.startsWith('/tool')) {
                addMessage('user', rawText);
                if (currentMode === 'private') messages.push({ role: 'user', text: rawText });
                addMessage('system', '咻——让我想想...');
                const reply = await getAIResponse(rawText);
                document.querySelectorAll('.message.system').forEach(el => {
                    if (el.textContent.includes('咻——让我想想...')) el.remove();
                });
                addMessage('assistant', reply);
                if (currentMode === 'private') {
                    messages.push({ role: 'assistant', text: reply });
                    localStorage.setItem('ruling_history', JSON.stringify(messages));
                }
                return;
            }

            // ---- 如果是合同相关，但没有任何路径 ----
            if (isContractRelated && !rawText.includes('D:') && !rawText.includes('C:') && !rawText.includes('\\\\\\\\')) {
                if (currentMode !== 'private') {
                    addMessage('system', '⚠️ 需要进入主权模式。');
                    return;
                }
                // 检查是否在询问能力（包含“能”、“可以”、“吗”等词）
                if (rawText.includes('能') || rawText.includes('可以') || rawText.includes('吗')) {
                    addMessage('system', '可以。合同审核支持两种方式：\\n1. 文本格式合规（本地规则引擎）\\n2. 法律风险核对（大模型深度分析）\\n请问您需要哪种？请回复数字 1 或 2。');
                    window._pendingDirection = true;
                    return;
                }
                // 否则直接反问方向
                addMessage('system', '📌 请问您要审查合同的哪方面？\\n1. 文本格式合规（本地规则引擎）\\n2. 法律风险核对（大模型深度分析）\\n请回复数字 1 或 2。');
                window._pendingDirection = true;
                return;
            }

            // ---- 如果是合同相关，且包含路径 ----
            if (isContractRelated && (rawText.includes('D:') || rawText.includes('C:') || rawText.includes('\\\\\\\\'))) {
                if (currentMode !== 'private') {
                    addMessage('system', '⚠️ 需要进入主权模式。');
                    return;
                }
                // 提取路径
                const pathMatch = rawText.match(/([A-Za-z]:\\\\[^\\\\s]*)/);
                const filePath = pathMatch ? pathMatch[1] : '';
                if (!filePath) {
                    addMessage('system', '📌 请提供有效文件路径。示例：D:\\\\合同\\\\合作协议.docx');
                    return;
                }
                // 判断方向：如果用户提到了法律或风险
                let direction = 'text_format';
                if (rawText.includes('法律') || rawText.includes('风险') || rawText.includes('核对')) {
                    direction = 'legal_risk';
                }
                // 构造待执行任务
                const intent = {
                    toolId: 'T002',
                    params: { path: filePath },
                    taskDirection: direction
                };
                window._pendingIntent = intent;
                window._pendingUserText = rawText;
                const summaryMsg = `📋 任务确认：\\n- 操作：合同审查\\n- 方向：${direction === 'text_format' ? '文本格式合规' : '法律风险核对'}\\n- 文件：${filePath}\\n- 结果位置：D:\\\\藏器魂系统\\\\results\\\\\\n\\n请回复“是”确认执行，回复“否”取消。`;
                addMessage('system', summaryMsg);
                return;
            }

            // ---- 如果是数据清洗（简化） ----
            if (isDataRelated && !rawText.startsWith('/tool')) {
                if (currentMode !== 'private') {
                    addMessage('system', '⚠️ 需要进入主权模式。');
                    return;
                }
                const pathMatch = rawText.match(/([A-Za-z]:\\\\[^\\\\s]*)/);
                if (!pathMatch) {
                    addMessage('system', '📌 请提供数据文件路径。示例：D:\\\\数据\\\\测试数据.xlsx');
                    return;
                }
                const intent = {
                    toolId: 'T001',
                    params: { path: pathMatch[1] },
                    taskDirection: 'clean'
                };
                window._pendingIntent = intent;
                window._pendingUserText = rawText;
                const summaryMsg = `📋 任务确认：\\n- 操作：数据清洗\\n- 文件：${pathMatch[1]}\\n- 结果位置：D:\\\\藏器魂系统\\\\results\\\\\\n\\n请回复“是”确认执行，回复“否”取消。`;
                addMessage('system', summaryMsg);
                return;
            }

            // ============================================================
            // 第五步：/tool 指令（保留原有逻辑）
            // ============================================================
            if (rawText.startsWith('/tool')) {
                const parts = rawText.split(' ');
                if (parts.length < 2) {
                    addMessage('system', '❌ 格式错误。');
                    return;
                }
                const localTool = parts[1];
                let nestedParams = {};
                for (let i = 2; i < parts.length; i++) {
                    if (parts[i] === '--params' && i + 1 < parts.length) {
                        try {
                            nestedParams = JSON.parse(parts.slice(i + 1).join(' '));
                            break;
                        } catch (e) {
                            nestedParams = { raw: parts.slice(i + 1).join(' ') };
                            break;
                        }
                    }
                }

                if ((localTool === 'contract' || localTool === 'clean') && !nestedParams.file && !nestedParams.path) {
                    addMessage('system', '📌 请提供文件路径。');
                    return;
                }

                addMessage('user', rawText);
                addMessage('system', '执行中...');

                try {
                    const response = await fetch(PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tool: localTool, params: nestedParams })
                    });
                    const result = await response.json();
                    if (result.success) {
                        let displayData = result.data;
                        if (result.data && result.data.stdout) displayData = result.data.stdout;
                        else if (result.data && result.data.echo) displayData = JSON.stringify(result.data.echo);
                        else displayData = JSON.stringify(result.data);
                        addMessage('assistant', '✅ ' + displayData);
                        const path = nestedParams.path || nestedParams.command || '本地';
                        addMessage('system', '📌 结果已生成，请去 ' + path + ' 审核确认。');
                        addMessage('system', '📋 接下来您可以：\\n1. 继续审查另一份合同\\n2. 执行数据清洗\\n3. 查看审计日志\\n4. 结束对话\\n\\n请回复数字 1、2、3 或 4 选择。');
                        window._waitingNextStep = true;
                        memoryManager.save({
                            role: 'assistant',
                            content: displayData,
                            toolUsed: localTool
                        });
                    } else {
                        addMessage('system', '❌ 执行失败: ' + (result.error || '未知错误'));
                    }
                } catch (err) {
                    addMessage('system', '❌ 调度失败: ' + err.message);
                }
                return;
            }

            // ============================================================
            // 兜底：没匹配到任何逻辑
            // ============================================================
            addMessage('system', '📌 未识别指令。请尝试“审查合同”或“数据清洗”。');
        }

        // =============================================
        // 键盘事件
        // =============================================
        document.getElementById('userInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.shiftKey) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // =============================================
        // 初始化
        // =============================================
        localStorage.removeItem('sovereign_verified');
        localStorage.removeItem('sovereign_identity_id');

        enterPublic();
        renderConversationList();
    </script>
</body>

</html>
