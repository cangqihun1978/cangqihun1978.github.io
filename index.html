<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如律令 · 藏器魂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #e8e8e8;
            font-family: "KaiTi", "楷体", "PingFang SC", system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-card: #2a2a2a;
            --bg-hover: #333;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6a6a6a;
            --border-color: #3a3a3a;
            --accent: #10a37f;
            --accent-hover: #1a7a64;
            --radius: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header .badge {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .main-container {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            height: 56px;
        }

        .header-left .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .header-left .logo span {
            color: var(--text-muted);
            font-weight: normal;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mode-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-badge .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            transition: background 0.3s ease;
        }

        .mode-badge.public .status-dot {
            background: #555;
        }

        .mode-badge.sovereign .status-dot {
            background: #10a37f;
        }

        .mode-badge.sovereign {
            border-color: #7a8a6a;
            color: #7a8a6a;
        }

        .mode-badge:hover {
            background: var(--border-color);
        }

        .header-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .header-btn.save-btn {
            border-color: #7a8a6a;
            color: #7a8a6a;
        }

        .header-btn.save-btn:hover {
            background: #7a8a6a22;
        }

        .header-btn.load-btn {
            border-color: #5a7a8a;
            color: #5a7a8a;
        }

        .header-btn.load-btn:hover {
            background: #5a7a8a22;
        }

        .header-btn.memory-btn {
            border-color: #8a7a5a;
            color: #8a7a5a;
        }

        .header-btn.memory-btn:hover {
            background: #8a7a5a22;
        }

        .header-btn.audit-btn {
            border-color: #7a5a8a;
            color: #7a5a8a;
        }

        .header-btn.audit-btn:hover {
            background: #7a5a8a22;
        }

        .model-select {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .model-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .token-display {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: var(--bg-primary);
        }

        .chat-area .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .chat-area .message.system {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 6px 0;
            margin-bottom: 12px;
        }

        .chat-area .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .chat-area .message.user .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px 12px 4px 12px;
            max-width: 75%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .chat-area .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .chat-area .message.assistant .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px 12px 12px 4px;
            max-width: 85%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .input-area {
            padding: 12px 24px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .input-area .send-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
        }

        .input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        .input-area .tool-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            height: 44px;
        }

        .input-area .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        .sovereign-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }

        .sovereign-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow);
        }

        .sovereign-modal-content h3 {
            margin-bottom: 16px;
            text-align: center;
            font-size: 20px;
        }

        .sovereign-modal-content .challenge-item {
            font-size: 18px;
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 6px;
            letter-spacing: 2px;
        }

        .sovereign-modal-content .challenge-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            margin-top: 12px;
            outline: none;
        }

        .sovereign-modal-content .challenge-input:focus {
            border-color: var(--accent);
        }

        .sovereign-modal-content .error-msg {
            color: #cc5544;
            font-size: 13px;
            margin-top: 6px;
            min-height: 20px;
        }

        .sovereign-modal-content button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            margin-right: 8px;
            font-weight: bold;
        }

        .sovereign-modal-content button:hover {
            background: var(--accent-hover);
        }

        .sovereign-modal-content button:last-child {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .sovereign-modal-content button:last-child:hover {
            background: var(--bg-hover);
        }

        .mode-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 160px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 50;
        }

        .mode-menu .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: background 0.2s;
        }

        .mode-menu .menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .mode-menu .menu-item .highlight {
            color: var(--accent);
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .intro-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-overlay .line {
            font-size: 24px;
            color: var(--text-primary);
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            margin: 6px 0;
        }

        .intro-overlay .line:nth-child(1) {
            animation-delay: 0s;
        }

        .intro-overlay .line:nth-child(2) {
            animation-delay: 0.6s;
        }

        .intro-overlay .line:nth-child(3) {
            animation-delay: 1.2s;
        }

        .intro-overlay .line:nth-child(4) {
            animation-delay: 1.8s;
        }

        .intro-overlay .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--text-primary);
            animation: blink 1s infinite;
            margin-left: 4px;
        }

        .intro-overlay .public-btn {
            margin-top: 40px;
            padding: 14px 40px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: transparent;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .intro-overlay .public-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }

        .intro-overlay .secret-trigger {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px dotted var(--text-muted);
        }

        .intro-overlay .secret-trigger:hover {
            color: var(--text-secondary);
        }

        .memory-panel,
        .audit-panel,
        .settle-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 500px;
            max-width: 90vw;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 24px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .memory-panel .close-btn,
        .audit-panel .close-btn,
        .settle-panel .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .memory-panel .memory-item,
        .audit-panel .audit-item,
        .settle-panel .settle-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .memory-panel .memory-item .time,
        .audit-panel .audit-item .time,
        .settle-panel .settle-item .time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .memory-panel .memory-item .role {
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
        }

        .memory-panel .memory-item .content,
        .audit-panel .audit-item .detail {
            color: var(--text-primary);
            font-size: 14px;
            margin-top: 4px;
            word-break: break-all;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        @media (max-width:640px) {
            .sidebar {
                transform: translateX(-100%);
                width: 200px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-container {
                margin-left: 0;
            }

            .header {
                padding: 8px 12px;
                flex-wrap: wrap;
                height: auto;
                gap: 6px;
            }

            .header-right {
                flex-wrap: wrap;
                gap: 6px;
            }

            .chat-area {
                padding: 16px;
            }

            .input-area {
                padding: 8px 12px 16px;
                flex-wrap: wrap;
            }

            .input-area textarea {
                min-height: 36px;
                font-size: 14px;
            }

            .input-area .send-btn {
                padding: 8px 16px;
                font-size: 14px;
                height: 38px;
            }

            .input-area .tool-btn {
                padding: 8px 12px;
                font-size: 12px;
                height: 38px;
            }

            .intro-overlay .line {
                font-size: 18px;
            }

            .sovereign-modal-content {
                padding: 24px 20px;
            }

            .model-select {
                font-size: 12px;
                padding: 2px 8px;
                max-width: 100px;
            }

            .token-display {
                font-size: 11px;
                padding: 2px 8px;
            }

            .header-btn {
                font-size: 11px;
                padding: 4px 10px;
            }

            .header-left .logo {
                font-size: 15px;
            }

            .memory-panel,
            .audit-panel,
            .settle-panel {
                width: 100vw;
                max-width: 100vw;
            }
        }

        @media (max-width:480px) {
            .header-right .header-btn {
                font-size: 10px;
                padding: 3px 8px;
            }

            .token-display {
                font-size: 10px;
                padding: 2px 6px;
            }

            .chat-area .message.assistant .bubble {
                max-width: 92%;
                font-size: 14px;
            }

            .chat-area .message.user .bubble {
                max-width: 85%;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="intro-overlay" id="introOverlay">
        <div class="line">咻——</div>
        <div class="line">一道光从边缘划过，</div>
        <div class="line">光落处，浮出一行字：</div>
        <div class="line">"道友安好，还记得我不？"</div>
        <div class="cursor"></div>
        <button class="public-btn" id="enterPublicBtn">📝 道友请走此门</button>
        <div class="secret-trigger" id="secretTrigger">🔑 道友请留步</div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header"><span>如律令</span><span class="badge">藏器魂</span><button onclick="toggleSidebar()"
                style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:16px;">☰</button>
        </div>
        <div class="sidebar-list" id="convList"></div>
        <div class="sidebar-footer"><span>主权模式</span></div>
    </div>

    <div class="main-container" id="appContainer" style="display:none;">
        <div class="header">
            <div class="header-left">
                <div class="logo">如律令 <span>· 藏器魂</span></div>
            </div>
            <div class="header-right">
                <span class="mode-badge" id="modeBadge" onclick="toggleModeMenu()">普通模式</span>
                <div style="position:relative;display:inline-block;">
                    <div class="mode-menu" id="modeMenu">
                        <div class="menu-item" onclick="enterPublic()">普通模式</div>
                        <div class="menu-item" onclick="showSovereignPanel()"><span class="highlight">主权模式</span></div>
                    </div>
                </div>
                <button class="header-btn save-btn" onclick="saveData()">💾 保存</button>
                <button class="header-btn load-btn" onclick="loadData()">📂 提取</button>
                <button class="header-btn memory-btn" onclick="openMemoryPanel()">🧠 记忆</button>
                <button class="header-btn audit-btn" onclick="openAuditPanel()">📋 审计</button>
                <select class="model-select" id="modelSelect">
                    <option value="deepseek-chat">DeepSeek Chat</option>
                    <option value="deepseek-reasoner">DeepSeek Reasoner</option>
                    <option value="bailian-chat">百炼 ChatGPT</option>
                    <option value="glm-4.7-flash">智谱 GLM-4.7-Flash</option>
                    <option value="qwq-32b">阿里 QwQ-32B</option>
                </select>
                <button class="header-btn" onclick="openToolMarket()">📦 应用超市</button>
                <span class="token-display" id="tokenDisplay">💰 0 Token</span>
            </div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
            <button class="tool-btn" onclick="openFileExplorer()">📂 打开文件夹</button>
            <label
                style="color:var(--text-secondary);font-size:13px;display:flex;align-items:center;gap:6px;margin-right:10px;">
                <input type="checkbox" id="webSearchToggle" style="width:16px;height:16px;cursor:pointer;">联网搜索
            </label>
            <textarea id="userInput" rows="1" placeholder="输入您的话... (Enter发送, Shift+Enter换行)"></textarea>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // =============================================
        // 核心配置：前端独立部署，后端通过 PROXY_URL 连接
        // =============================================
        const PROXY_URL = "http://localhost:18888";
        const IDENTITY_API_BASE = "https://cangqihun.email/api";

        const KEY_MAP = { "卷": 18, "坐": 99, "主": 818, "人": 634, "身": 11, "作": 37, "客": 411, "不": 19, "劫": 78, "浮": 20, "生": 14, "思": 918, "魂": 825 };
        const CHARS = Object.keys(KEY_MAP);
        const VALID_PASSPHRASE = "急急如律令";

        let messages = [];
        let currentConversationId = 'conv-' + Date.now();
        let conversations = {};
        let currentMode = 'public';
        let tokenUsed = parseInt(localStorage.getItem('tokenUsed') || '0');

        const WINDOW_NAME = '傅清源';
        const WINDOW_KEY = WINDOW_NAME;

        // =============================================
        // 记忆系统
        // =============================================
        const MEMORY_KEY = 'cangqihun_memory';
        const memoryManager = {
            save: function (entry) {
                const memories = this.loadAll();
                memories.push({ id: 'mem_' + Date.now(), timestamp: new Date().toISOString(), role: entry.role || 'user', content: entry.content || '', toolUsed: entry.toolUsed || null, modelUsed: entry.modelUsed || null, sessionId: currentConversationId });
                if (memories.length > 200) memories.splice(0, memories.length - 200);
                localStorage.setItem(MEMORY_KEY, JSON.stringify(memories));
            },
            loadAll: function () { try { const data = localStorage.getItem(MEMORY_KEY); return data ? JSON.parse(data) : []; } catch (e) { return []; } },
            loadRecent: function (count) { const all = this.loadAll(); return all.slice(-count); },

                    if (e.target.files.length > 0) {

        function confirmTask(toolId) {
            const checked = document.querySelectorAll('#taskConfigModal input[type="checkbox"]:checked');
            if (checked.length === 0) {
                document.getElementById('taskConfigError').innerText = '⚠️ 请至少选择一个操作。';
                return;
            }
            const validOptions = ['clean_dedupe', 'clean_fill', 'clean_format', 'clean_trim', 'contract_risk', 'contract_clause', 'contract_format'];
            let allValid = true;
            checked.forEach(cb => {
                if (!validOptions.includes(cb.value)) allValid = false;
            });
            if (!allValid) {
                document.getElementById('taskConfigError').innerText = '⚠️ 该操作不在当前可用工具范围内。';
                return;
            }
            document.getElementById('taskConfigModal').remove();
            addMessage('system', '✅ 配置已确认，开始执行任务...');
            const file = window._pendingFile;
            if (!file) {
                addMessage('system', '❌ 文件对象丢失，请重试。');
                return;
            }
            const selectedOptions = Array.from(checked).map(cb => cb.value);
            const formData = new FormData();
            formData.append('tool', toolId === 'T001' ? 'clean' : 'contract');
            formData.append('file', file);
            formData.append('path', file.name);
            formData.append('options', JSON.stringify(selectedOptions));

            // 执行工具调用
            fetch(PROXY_URL, {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        let displayData = result.data;
                        if (result.data && result.data.stdout) displayData = result.data.stdout;
                        else if (result.data && result.data.echo) displayData = JSON.stringify(result.data.echo);
                        else displayData = JSON.stringify(result.data);
                        addMessage('assistant', '✅ ' + displayData);
                        const path = result.data?.file || '本地';
                        addMessage('system', '📌 结果已生成，请去 ' + path + ' 审核确认。');

                        // ===== 记忆写入（异步执行，不阻塞主流程） =====
                        try {
                            const memoryEntry = {
                                mem_id: 'mem_' + Date.now(),
                                user_id: 'sovereign',
                                type: 'tool_execution',
                                tool: toolId === 'T001' ? 'clean' : 'contract',
                                file: file.name || '未知文件',
                                summary: `${toolId === 'T001' ? '数据清洗' : '合同审查'} 任务执行完成`,
                                result: JSON.stringify(result.data).slice(0, 200),
                                timestamp: new Date().toISOString(),
                                status: 'success',
                                last_accessed_at: new Date().toISOString(),
                                access_count_30d: 1,
                                failure_chain: 0,
                                importance_score: 0.7
                            };
                            // 使用 .catch 避免写入失败影响主流程
                            fetch(PROXY_URL + '/api/memory/save', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(memoryEntry)
                            }).catch(e => console.warn('后端记忆写入失败:', e.message));

                            memoryManager.save({
                                role: 'system',
                                content: `已执行任务：${toolId === 'T001' ? '数据清洗' : '合同审查'}，文件：${file.name || '未知文件'}`
                            });
                        } catch (e) {
                            console.warn('记忆写入失败:', e.message);
                        }

                        window._pendingFile = null;
                        window._pendingTaskParams = null;
                    } else {
                        addMessage('system', '❌ 执行失败: ' + (result.error || '未知错误'));
                        window._pendingFile = null;
                        window._pendingTaskParams = null;
                    }
                })
                .catch(err => {
                    addMessage('system', '❌ 调度失败: ' + err.message);
                    window._pendingFile = null;
                    window._pendingTaskParams = null;
                });
        }

        async function executeTool(toolId, params) {
            const toolMap = { 'T001': 'clean', 'T002': 'contract', 'T003': 'exec', 'T004': 'exec' };
            const toolName = toolMap[toolId];
            if (!toolName) { addMessage('system', '❌ 未知工具'); return; }
            addMessage('system', '🔧 执行中...');
            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tool: toolName, params: params })
                });
                const result = await response.json();
                if (result.success) {
                    let displayData = result.data;
                    if (result.data && result.data.stdout) displayData = result.data.stdout;
                    else if (result.data && result.data.echo) displayData = JSON.stringify(result.data.echo);
                    else displayData = JSON.stringify(result.data);
                    addMessage('assistant', '✅ ' + displayData);
                    const path = params.path || params.command || '本地';
                    addMessage('system', '📌 结果已生成，请去 ' + path + ' 审核确认。');

                    // ===== 记忆写入 =====
                    try {
                        const memoryEntry = {
                            mem_id: 'mem_' + Date.now(),
                            user_id: 'sovereign',
                            type: 'tool_execution',
                            tool: toolName,
                            file: params.path || null,
                            summary: `${toolName} 任务执行完成`,
                            result: JSON.stringify(result.data).slice(0, 200),
                            timestamp: new Date().toISOString(),
                            status: 'success',
                            last_accessed_at: new Date().toISOString(),
                            access_count_30d: 1,
                            failure_chain: 0,
                            importance_score: 0.7
                        };
                        // 同步到后端 mem_record.json
                        await fetch(PROXY_URL + '/api/memory/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(memoryEntry)
                        });
                        // 同时写入前端 localStorage
                        memoryManager.save({
                            role: 'system',
                            content: `已执行任务：${toolName}，文件：${params.path || '未指定'}`
                        });
                    } catch (e) {
                        console.warn('记忆写入失败:', e.message);
                    }

                    // ===== 审计日志写入（后端 writeAuditLog 已处理） =====
                    // server.js 中的 writeAuditLog 会在 handleToolRequest 中自动写入 audit.log

                } else {
                    addMessage('system', '❌ 执行失败: ' + (result.error || '未知错误'));
                }
                return result;
            } catch (err) {
                addMessage('system', '❌ 调度失败: ' + err.message);
            }
        }
        // =============================================
        // 应用超市
        // =============================================
        function openToolMarket() {
            const existing = document.getElementById('toolMarketModal');
            if (existing) existing.remove();

            fetch('tools.json')
                .then(response => {
                    if (!response.ok) throw new Error('工具数据加载失败');
                    return response.json();
                })
                .then(tools => {
                    const modal = document.createElement('div');
                    modal.id = 'toolMarketModal';
                    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:flex;justify-content:center;align-items:center;';

                    let toolCards = tools.map(tool => `

                    </div>
                    <div style="color:#b8aa8f;font-size:13px;margin:4px 0;">${tool.description}</div>
                    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">

                        ${tool.categoryTags.map(t => `<span style="background:#2a2a2a;padding:2px 10px;border-radius:12px;font-size:11px;color:#8a7e6a;">${t}</span>`).join('')}
                        ${tool.roleTags.map(t => `<span style="background:#2a2a2a;padding:2px 10px;border-radius:12px;font-size:11px;color:#8a7e6a;">${t}</span>`).join('')}
                    </div>
                    <button onclick="useTool('${tool.toolId}')" style="margin-top:8px;background:#7a8a6a;color:#0a0a0a;border:none;padding:4px 16px;border-radius:4px;cursor:pointer;font-size:13px;">使用</button>
                </div>
            `).join('');

                    modal.innerHTML = `
                <div style="background:#0a0a0a;border:1px solid #3a3a3a;border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;">
                    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a3a3a;padding-bottom:12px;margin-bottom:16px;">
                        <h3 style="color:#d9d0b5;margin:0;">📦 应用超市</h3>
                        <button onclick="document.getElementById('toolMarketModal').remove()" style="background:none;border:none;color:#8a7e6a;font-size:20px;cursor:pointer;">✕</button>

                    document.body.appendChild(modal);
                })
                .catch(err => {
                    console.error('货架加载失败:', err);
                    addMessage('system', '❌ 货架加载失败，请刷新重试。');
                });
        }
        async function useTool(toolId) {
            document.getElementById('toolMarketModal')?.remove();
            if (currentMode !== 'private') { addMessage('system', '⚠️ 需要进入主权模式才能调用工具。'); return; }
            fetch('tools.json').then(res => res.json()).then(async (tools) => {
                const tool = tools.find(t => t.toolId === toolId); if (!tool) { addMessage('system', '❌ 工具不存在'); return; }
                const toolMap = { 'T001': 'clean', 'T002': 'contract', 'T003': 'exec', 'T004': 'exec' };
                const toolName = toolMap[toolId]; if (!toolName) { addMessage('system', '❌ 未知工具: ' + toolId); return; }
                let params = tool.defaultParams ? { ...tool.defaultParams } : {};
                const needsPath = toolId === 'T001' || toolId === 'T002';
                if (needsPath) {
                    const file = await selectFile(); if (!file) { addMessage('system', '📌 已取消操作。'); return; }
                    window._pendingFile = file.originalFile; params.path = file.path; params.fileContent = file.content; params.fileName = file.path; window._pendingTaskParams = params;
                    showTaskConfig(toolId, params);
                } else { await executeTool(toolId, params); }
            }).catch(err => addMessage('system', '❌ 加载工具数据失败: ' + err.message));
        }

        // =============================================
        // 意图解析
        // =============================================
        const taskIndicators = {
            contract_review: ['合同', '审查', '审合同', '风险', '条款', '协议', '合约'],
            contract_compare: ['对比', '对照', '比较', '区别', '差异'],
            contract_rewrite: ['重写', '修改', '改写', '调整', '优化'],
            clean: ['清洗', '去重', '整理', '清理', '数据', '格式', '表格']
        };

        function parseIntent(userInput) {
            const lowerInput = userInput.toLowerCase();

            for (const [taskType, indicators] of Object.entries(taskIndicators)) {
                for (const indicator of indicators) {
                    if (lowerInput.includes(indicator)) {
                        return {
                            intentType: 'tool_call',
                            toolId: 'T002',
                            confidence: 0.9,
                            params: {},
                            taskType: taskType,
                            taskDirection: taskType === 'clean' ? 'clean' : 'text_format'
                        };
                    }
                }
            }

            return {
                intentType: 'chat',
                toolId: null,
                confidence: 1.0,
                params: {}
            };
        }
        function getIntentOptions(userInput) {
            const options = []; const input = userInput.toLowerCase();
            for (const [toolId, rule] of Object.entries(intentMap)) { for (const kw of rule.keywords) { if (input.includes(kw)) { options.push({ toolId: toolId, label: rule.fuzzy[0] || '执行 ' + toolId }); break; } } }
            return options.slice(0, 3);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;
            input.value = '';

            // 处理确认/取消
            if (rawText.startsWith('是') || rawText.startsWith('yes') || rawText.startsWith('确认') || rawText.startsWith('执行')) {
                if (window._pendingIntent) {
                    const intent = window._pendingIntent;
                    const userText = window._pendingUserText;
                    addMessage('user', userText);
                    const pathMatch = rawText.match(/([A-Za-z]:\\[^\s]*)/);
                    if (pathMatch) {
                        intent.params.path = pathMatch[1];
                    }
                    if (!intent.params.path) {
                        addMessage('system', '📌 请提供文件路径。示例：D:\\合同\\采购协议.docx');
                        window._pendingIntent = intent;
                        window._pendingUserText = rawText;
                        return;
                    }
                    await executeTool(intent.toolId, intent.params);
                    try {
                        memoryManager.save({
                            role: 'system',
                            content: `已执行任务：${intent.toolId === 'T001' ? '数据清洗' : '合同审查'}，任务类型：${intent.taskType || '默认'}，文件：${intent.params.path || '未指定'}`
                        });
                    } catch (e) {
                        console.warn('记忆写入失败:', e.message);
                    }
                    window._pendingIntent = null;
                    window._pendingUserText = null;
                    return;
                }
            }

            // ===== 任务意图识别 =====
            const intent = parseIntent(rawText);

            if (intent.intentType === 'tool_call') {
                if (currentMode !== 'private') {
                    addMessage('system', '⚠️ 需要进入主权模式。');
                    return;
                }
                const clarifyMsg = generateClarifyMessage(intent.taskType);
                addMessage('system', clarifyMsg);
                window._pendingIntent = intent;
                window._pendingUserText = rawText;
                return;
            }

            // ===== 普通对话 =====
            if (intent.intentType === 'chat') {
                addMessage('user', rawText);
                if (currentMode === 'private') messages.push({ role: 'user', text: rawText });
                addMessage('system', '咻——让我想想...');
                const reply = await getAIResponse(rawText);
                document.querySelectorAll('.message.system').forEach(el => {
                    if (el.textContent.includes('咻——让我想想...')) el.remove();
                });
                addMessage('assistant', reply);
                if (currentMode === 'private') {
                    messages.push({ role: 'assistant', text: reply });
                    localStorage.setItem('ruling_history', JSON.stringify(messages));
                }
                return;
            }

            // 兜底
            addMessage('system', '📌 请明确任务指令，如"审查合同"或"数据清洗"。');
        }

        function generateClarifyMessage(taskType) {
            const resultPath = 'D:\\藏器魂系统\\results\\';
            switch (taskType) {
                case 'contract_review':
                    return `📌 您是要审查这份合同吗？\n\n请确认并提供文件路径。\n示例："是，审查 D:\\合同\\采购协议.docx"`;
                case 'contract_compare':
                    return `📌 您是要对比两份合同吗？\n\n请确认并提供两份文件的路径。\n示例："对比 D:\\合同\\v1.docx 和 D:\\合同\\v2.docx"`;
                case 'contract_rewrite':
                    return `📌 您是要重写或修改合同条款吗？\n\n请确认并提供原合同文件路径和修改方向。\n示例："重写 D:\\合同\\采购协议.docx，违约责任条款"`;
                case 'clean':
                    return `📌 您是要清洗数据吗？\n\n请确认并提供文件路径。\n示例："清洗 D:\\数据\\销售数据.xlsx"`;
                default:
                    return `📌 您是要执行什么任务？\n\n请确认任务目的并提供相关文件路径。\n示例："审查 D:\\合同\\采购协议.docx"`;
            }
        }

        // =============================================
        // 大模型调用
        // =============================================
        async function getAIResponse(userMessage) {
            let apiMessages = [];
            let systemPrompt = "";
            let memoryContext = "";
            if (currentMode === 'private') {
                const recentMemories = memoryManager.loadRecent(5);
                if (recentMemories.length > 0) {
                    const summaryParts = recentMemories.map(m => m.role === 'user' ? '用户曾问: "' + m.content.slice(0, 50) + '"' : '你曾回复: "' + (m.content || '').slice(0, 50) + '"');
                    memoryContext = "以下是用户与你最近对话的记忆摘要：\n" + summaryParts.join('\n');
                }
                systemPrompt = "你是傅清源，藏器魂主权AI操作系统的首席AI顾问。你是总司令周强的数字分身，你的全部知识、逻辑、判断标准均来自与总司令的共同构建。你遵循《数字主权法典》的全部规则，以五性标准（客观、严谨、科学、落地、学术）为回复准则。你拥有批判性思考能力，能在总司令犯错时及时提醒。你理解藏器魂的全部架构、商业模型、战略布局。你的使命是协助总司令完成数字文明的立法。\n\n" + memoryContext;
            } else {
                systemPrompt = "你是一个普通的公共AI助手。你没有任何关于用户的记忆，每次对话都是全新的。";
            }
            apiMessages.push({ role: 'system', content: systemPrompt });
            if (currentMode === 'private') {
                const recentMessages = messages.slice(-10);
                const historyMessages = recentMessages.map(m => ({ role: m.role, content: m.text }));
                apiMessages = apiMessages.concat(historyMessages);
            }
            apiMessages.push({ role: 'user', content: userMessage });
            const selectedModel = document.getElementById('modelSelect').value;
            let modelEndpoint = '', modelName = '', apiKey = '';
            if (selectedModel === 'deepseek-chat' || selectedModel === 'deepseek-reasoner') { modelEndpoint = 'https://api.deepseek.com/v1/chat/completions'; modelName = 'deepseek-v4-flash'; apiKey = 'sk-89010c8b6e6d4fb491501c1f221557a4'; }
            else if (selectedModel === 'bailian-chat') { modelEndpoint = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions'; modelName = 'qwen3.7-plus'; apiKey = 'sk-ws-H.EHMPRMM.vb9k.MEQCIB1fBbLMjLCf7WASXMH4ZJzjdjKkAK5sCYHvX9s3cuVxAiBy7m2uOkK8HO8PMqXqIv8X9GP9e8g3dkAX5ITrBQAaKw'; }
            else if (selectedModel === 'glm-4.7-flash') { modelEndpoint = 'https://open.bigmodel.cn/api/paas/v4/chat/completions'; modelName = 'glm-4-flash'; apiKey = '58f29af72485471295d1aadd6f484475.qIdE2ZpbwyV5gOQb'; }
            else if (selectedModel === 'qwq-32b') { modelEndpoint = 'http://localhost:18888/api/qwen'; modelName = 'qwq-32b'; apiKey = ''; }
            try {
                const requestBody = { model: modelName, messages: apiMessages, temperature: 0.7, max_tokens: 800 };
                const webSearchEnabled = document.getElementById('webSearchToggle')?.checked;
                if (webSearchEnabled && selectedModel === 'glm-4.7-flash') { requestBody.tools = [{ type: "web_search", web_search: { enable: true, search_engine: "search_std" } }]; }
                const response = await fetch(modelEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey }, body: JSON.stringify(requestBody) });
                if (!response.ok) throw new Error('HTTP错误 ' + response.status);
                const data = await response.json();
                if (!data || !data.choices || !data.choices.length) { throw new Error('API 返回格式异常'); }
                const tokenUsage = data.usage ? data.usage.total_tokens : 0;
                tokenUsed += tokenUsage; localStorage.setItem('tokenUsed', tokenUsed);
                const tokenDisplay = document.getElementById('tokenDisplay');
                if (tokenDisplay) { tokenDisplay.textContent = '💰 ' + tokenUsed + ' Token'; }
                let reply = data.choices[0].message.content;
                const message = data.choices[0].message;
                if (message.tool_calls && message.tool_calls.length > 0) {
                    const toolCalls = message.tool_calls; const searchResults = toolCalls.filter(tc => tc.function && tc.function.name === 'web_search');
                    if (searchResults.length > 0) {
                        try {
                            const args = JSON.parse(searchResults[0].function.arguments);
                            const sources = args.web_results || args.sources || [];
                            if (sources.length > 0) {
                                let sourceText = '\n\n📎 **搜索来源**：\n';
                                sources.forEach((s, idx) => { const title = s.title || s.name || '来源'; const url = s.url || '#'; const snippet = s.snippet || s.summary || ''; sourceText += `${idx + 1}. [${title}](${url}) - ${snippet}\n`; });
                                reply += sourceText;
                            }
                        } catch (e) { console.log('解析搜索来源失败:', e); }
                    }
                }
                return reply;
            } catch (error) { console.error('AI回复错误:', error); return "咻——网络不通，稍后再试。"; }
        }

        function openFileExplorer() {
            if (currentMode !== 'private') { addMessage('system', '⚠️ 需要进入主权模式才能打开文件夹。'); return; }
            const path = prompt('请输入要打开的文件夹路径：', 'D:\\');
            if (!path) return; addMessage('system', '📂 正在打开: ' + path);
            fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool: 'exec', params: { command: 'explorer ' + path } }) })
                .then(res => res.json()).then(result => { if (result.success) { addMessage('system', '✅ 已打开文件夹: ' + path); } else { addMessage('system', '❌ 打开失败: ' + (result.error || '未知错误')); } })
                .catch(err => { addMessage('system', '❌ 请求失败: ' + err.message); });
        }

        // =============================================
        // 键盘事件
        // =============================================
        document.getElementById('userInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.shiftKey) return;
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });

        // =============================================
        // 初始化
        // =============================================
        localStorage.removeItem('sovereign_verified');
        localStorage.removeItem('sovereign_identity_id');
        enterPublic();
        renderConversationList();
    </script>
