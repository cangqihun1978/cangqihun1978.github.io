<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如律令</title>
    <style>f
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-hover: #2a2a2a;
            --text-primary: #d9d0b5;
            --text-secondary: #b8aa8f;
            --text-muted: #5a4e3e;
            --border-color: #3a3a3a;
            --accent: #7a8a6a;
            --accent-hover: #8a9a7a;
            --radius: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: "KaiTi", "楷体", "PingFang SC", system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header .badge {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidebar-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent);
            color: var(--text-primary);
        }

        .sidebar-item .icon {
            font-size: 16px;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 主界面 */
        .main-container {
            margin-left: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
        }

        /* 顶部栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            height: 56px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .header-left .logo span {
            color: var(--text-muted);
            font-weight: normal;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-badge.sovereign {
            border-color: #7a8a6a;
            color: #7a8a6a;
        }

        .mode-badge:hover {
            background: var(--border-color);
        }

        .header-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .header-btn.save-btn {
            border-color: #7a8a6a;
            color: #7a8a6a;
        }

        .header-btn.save-btn:hover {
            background: #7a8a6a22;
        }

        .header-btn.load-btn {
            border-color: #5a7a8a;
            color: #5a7a8a;
        }

        .header-btn.load-btn:hover {
            background: #5a7a8a22;
        }

        .model-select {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .model-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .token-display {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }

        /* 对话区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: var(--bg-primary);
        }

        .chat-area .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .chat-area .message.system {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 6px 0;
            margin-bottom: 12px;
        }

        .chat-area .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .chat-area .message.user .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px 12px 4px 12px;
            max-width: 75%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .chat-area .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .chat-area .message.assistant .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px 12px 12px 4px;
            max-width: 85%;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .chat-area .message.assistant .bubble p {
            margin: 6px 0;
        }

        .chat-area .message.assistant .bubble ul,
        .chat-area .message.assistant .bubble ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        /* 输入区域 */
        .input-area {
            padding: 12px 24px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .input-area .send-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
        }

        .input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        .input-area .tool-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            height: 44px;
        }

        .input-area .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 主权验证弹窗 */
        .sovereign-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }

        .sovereign-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow);
        }

        .sovereign-modal-content h3 {
            margin-bottom: 16px;
            text-align: center;
            font-size: 20px;
        }

        .sovereign-modal-content .challenge-item {
            font-size: 18px;
            text-align: center;
            margin: 8px 0;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 6px;
            letter-spacing: 2px;
        }

        .sovereign-modal-content .challenge-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            margin-top: 12px;
            outline: none;
        }

        .sovereign-modal-content .challenge-input:focus {
            border-color: var(--accent);
        }

        .sovereign-modal-content .error-msg {
            color: #cc5544;
            font-size: 13px;
            margin-top: 6px;
            min-height: 20px;
        }

        .sovereign-modal-content button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            margin-right: 8px;
            font-weight: bold;
        }

        .sovereign-modal-content button:hover {
            background: var(--accent-hover);
        }

        .sovereign-modal-content button:last-child {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .sovereign-modal-content button:last-child:hover {
            background: var(--bg-hover);
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .sidebar-list::-webkit-scrollbar {
            width: 3px;
        }

        /* 模式菜单 */
        .mode-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 160px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 50;
        }

        .mode-menu .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: background 0.2s;
        }

        .mode-menu .menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .mode-menu .menu-item .highlight {
            color: var(--accent);
        }

        /* 开启动画 */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .intro-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-overlay .line {
            font-size: 24px;
            color: var(--text-primary);
            opacity: 0;
            animation: fadeIn 0.8s forwards;
            margin: 6px 0;
        }

        .intro-overlay .line:nth-child(1) {
            animation-delay: 0s;
        }

        .intro-overlay .line:nth-child(2) {
            animation-delay: 0.6s;
        }

        .intro-overlay .line:nth-child(3) {
            animation-delay: 1.2s;
        }

        .intro-overlay .line:nth-child(4) {
            animation-delay: 1.8s;
        }

        .intro-overlay .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--text-primary);
            animation: blink 1s infinite;
            margin-left: 4px;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        .intro-overlay .public-btn {
            margin-top: 40px;
            padding: 14px 40px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: transparent;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .intro-overlay .public-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }

        .intro-overlay .secret-trigger {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px dotted var(--text-muted);
        }

        .intro-overlay .secret-trigger:hover {
            color: var(--text-secondary);
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .sidebar {
                transform: translateX(-100%);
                width: 200px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-container {
                margin-left: 0;
            }

            .header {
                padding: 8px 12px;
                flex-wrap: wrap;
                height: auto;
                gap: 6px;
            }

            .header-right {
                flex-wrap: wrap;
                gap: 6px;
            }

            .chat-area {
                padding: 16px;
            }

            .input-area {
                padding: 8px 12px 16px;
                flex-wrap: wrap;
            }

            .input-area textarea {
                min-height: 36px;
                font-size: 14px;
            }

            .input-area .send-btn {
                padding: 8px 16px;
                font-size: 14px;
                height: 38px;
            }

            .input-area .tool-btn {
                padding: 8px 12px;
                font-size: 12px;
                height: 38px;
            }

            .intro-overlay .line {
                font-size: 18px;
            }

            .sovereign-modal-content {
                padding: 24px 20px;
            }

            .model-select {
                font-size: 12px;
                padding: 2px 8px;
                max-width: 100px;
            }

            .token-display {
                font-size: 11px;
                padding: 2px 8px;
            }

            .header-btn {
                font-size: 11px;
                padding: 4px 10px;
            }

            .header-left .logo {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .header-right .header-btn {
                font-size: 10px;
                padding: 3px 8px;
            }

            .token-display {
                font-size: 10px;
                padding: 2px 6px;
            }

            .chat-area .message.assistant .bubble {
                max-width: 92%;
                font-size: 14px;
            }

            .chat-area .message.user .bubble {
                max-width: 85%;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- 开启动画 -->
    <div class="intro-overlay" id="introOverlay">
        <div class="line">咻——</div>
        <div class="line">一道光从边缘划过，</div>
        <div class="line">光落处，浮出一行字：</div>
        <div class="line">“道友安好，还记得我不？”</div>
        <div class="cursor"></div>
        <button class="public-btn" id="enterPublicBtn">?? 道友请走此门</button>
        <div class="secret-trigger" id="secretTrigger">?? 道友请留步</div>
    </div>

    <!-- 主容器 -->
    <div class="main-container" id="appContainer" style="display:none;">
        <!-- 顶部栏 -->
        <div class="header">
            <div class="header-left">
                <div class="logo">如律令 <span>· 藏器魂</span></div>
            </div>
            <div class="header-right">
                <span class="mode-badge" id="modeBadge" onclick="toggleModeMenu()">普通模式</span>
                <div style="position:relative;display:inline-block;">
                    <div class="mode-menu" id="modeMenu">
                        <div class="menu-item" onclick="enterPublic()">普通模式</div>
                        <div class="menu-item" onclick="showSovereignPanel()"><span class="highlight">主权模式</span></div>
                    </div>
                </div>
                <button class="header-btn save-btn" onclick="saveData()">?? 保存</button>
                <button class="header-btn load-btn" onclick="loadData()">?? 提取</button>
                <select class="model-select" id="modelSelect" onchange="switchModel()">
                    <option value="deepseek-chat">DeepSeek Chat</option>
                    <option value="deepseek-reasoner">DeepSeek Reasoner</option>
                    <option value="glm-4.7-flash">智谱 GLM-4.7-Flash</option>
                    <option value="qwq-32b">阿里 QwQ-32B</option>
                </select>
                <span class="token-display" id="tokenDisplay">💰 0 Token</span>
            </div>
        </div>

        <!-- 对话区域 -->
        <div class="chat-area" id="chatArea"></div>

        <!-- 输入区域 -->
        <div class="input-area">
            <button class="tool-btn" onclick="insertTool('file')">📁 文件管理</button>
            <button class="tool-btn" onclick="insertTool('clean')">🧹 数据清洗</button>
            <button class="tool-btn" onclick="insertTool('contract')">📄 合同审查</button>
            <textarea id="userInput" rows="1" placeholder="输入您的话... (Enter发送, Shift+Enter换行)"></textarea>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // 核心资产：API 密钥与代理服务
        const DEEPSEEK_API_KEY = "sk-89010c8b6e6d4fb491501c1f221557a4";
        const PROXY_URL = "http://cangqihun.nat100.top";
        // ===== 修改开始：新增身份认证后台地址 =====
        const IDENTITY_API_BASE = "http://121.41.100.242:3000/api";
        // ===== 修改结束 =====
        // 密钥映射：13 字密码表
        const KEY_MAP = { "卷": 18, "坐": 99, "主": 818, "人": 634, "身": 11, "作": 37, "客": 411, "不": 19, "劫": 78, "浮": 20, "生": 14, "思": 918, "魂": 825 };
        const CHARS = Object.keys(KEY_MAP);
        const VALID_PASSPHRASE = "急急如律令";

        // 全局状态
        let messages = [];
        let currentConversationId = 'conv-' + Date.now();
        let conversations = {};
        let currentMode = 'public';
        let tokenUsed = 0;

        //=======================================================
        // 定居引擎核心：封地管理
        // ======================================================
        const WINDOW_NAME = '傅清源';
        const WINDOW_KEY = WINDOW_NAME;

        async function settleWindow() {
            const stateData = {
                windowKey: WINDOW_KEY,
                currentMode: currentMode,
                messages: messages,
                tokenUsed: tokenUsed,
                preferences: {
                    model: document.getElementById('modelSelect').value,
                    fiveStandards: true
                },
                lastSettled: new Date().toISOString()
            };
            try {
                const blob = new Blob([JSON.stringify(stateData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = WINDOW_KEY + '_state_' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                addMessage('system', '✅ 窗口 "' + WINDOW_NAME + '" 已成功定居。');
                return true;
            } catch (error) {
                addMessage('system', '❌ 定居失败：' + error.message);
                return false;
            }
        }

        async function awakenWindow() {
            addMessage('system', '📂 请通过“提取”功能选择封地文件来恢复窗口。');
        }

        try {
            const savedConversations = localStorage.getItem('ruling_conversations');
            if (savedConversations) {
                conversations = JSON.parse(savedConversations);
            }
            const savedCurrentId = localStorage.getItem('ruling_current_conv_id');
            if (savedCurrentId && conversations[savedCurrentId]) {
                currentConversationId = savedCurrentId;
                messages = conversations[savedCurrentId].messages || [];
            } else if (Object.keys(conversations).length > 0) {
                currentConversationId = Object.keys(conversations)[0];
                messages = conversations[currentConversationId].messages || [];
            }
        } catch (e) { }

        const hasVisitedSovereign = localStorage.getItem('cangqihun_registered_passphrase');
        const introOverlay = document.getElementById('introOverlay');
        const appContainer = document.getElementById('appContainer');

        function enterPublic() {
            if (document.getElementById('modeMenu')) document.getElementById('modeMenu').style.display = 'none';
            if (introOverlay) introOverlay.style.display = 'none';
            if (appContainer) appContainer.style.display = 'flex';

            // 检查本地是否保存了主权验证状态
            const isVerified = localStorage.getItem('sovereign_verified');
            if (isVerified === 'true') {
                // 恢复主权模式
                currentMode = 'private';
                updateModeBadge();
                clearChatArea();
                try {
                    var saved = localStorage.getItem('ruling_history');
                    if (saved) messages = JSON.parse(saved);
                } catch (e) { }
                setTimeout(function () {
                    if (messages.length > 0) restoreChatArea();
                    else addMessage('system', '主权模式已恢复。');
                }, 100);
            } else {
                // 普通模式
                currentMode = 'public';
                messages = [];

        function showPasswordPanel() {
            const itemCount = Math.floor(Math.random() * 2) + 2;
            const selected = [], usedIndices = [];
            for (let i = 0; i < itemCount; i++) {
                let idx; do { idx = Math.floor(Math.random() * CHARS.length); } while (usedIndices.includes(idx));
                usedIndices.push(idx); const char = CHARS[idx], num = KEY_MAP[char];
                const showChar = Math.random() > 0.5;
                selected.push({ display: showChar ? char : num, answer: showChar ? num : char });
            }
            const modal = document.createElement('div');
            modal.className = 'sovereign-modal';
            modal.innerHTML = '<div class="sovereign-modal-content"><h3>🔐 主权验证</h3><div id="challenge-items"></div><input type="text" id="sovereign-answer" class="challenge-input" placeholder="用空格或逗号分隔答案" autocomplete="off"><div id="sovereign-error" class="error-msg"></div><button id="sovereign-submit">验证</button><button id="sovereign-cancel">取消</button></div>';
            document.body.appendChild(modal);
            const container = modal.querySelector('#challenge-items');
            selected.forEach(item => { const div = document.createElement('div'); div.className = 'challenge-item'; div.innerHTML = typeof item.display === 'number' ? '___ ' + item.display : item.display + ' ___'; container.appendChild(div); });
            const expectedAnswers = selected.map(s => String(s.answer));
            modal.querySelector('#sovereign-cancel').onclick = () => modal.remove();
            modal.querySelector('#sovereign-submit').onclick = () => {
                const input = modal.querySelector('#sovereign-answer').value.trim();
                if (!input) { modal.querySelector('#sovereign-error').innerText = '请输入答案'; return; }
                const userAnswers = input.split(/[\s,，]+/).filter(s => s.length > 0);
                if (userAnswers.length !== expectedAnswers.length) { modal.querySelector('#sovereign-error').innerText = '需要输入 ' + expectedAnswers.length + ' 个答案'; return; }
                const sortedExpected = [...expectedAnswers].sort(), sortedUser = [...userAnswers].sort();
                let allMatch = true; for (let i = 0; i < sortedExpected.length; i++) { if (sortedUser[i] !== sortedExpected[i]) { allMatch = false; break; } }
                if (allMatch) {
                    modal.remove();
                    currentMode = 'private';
                    addMessage('system', '主权已确认，进入私密模式。');
                    renderConversationList();
                    try { const saved = localStorage.getItem('ruling_history'); if (saved) messages = JSON.parse(saved); } catch (e) { }
                    updateModeBadge();
                    clearChatArea();
                    setTimeout(() => {
                        if (messages.length > 0) { restoreChatArea(); }
                    }, 100);
                } else { modal.querySelector('#sovereign-error').innerText = '验证失败，再试试？'; }
            };
        }

        function toggleModeMenu() {
            const menu = document.getElementById('modeMenu');

        function updateModeBadge() {
            const badge = document.getElementById('modeBadge');

        function clearChatArea() { document.getElementById('chatArea').innerHTML = ''; }

        function restoreChatArea() {
            const chat = document.getElementById('chatArea');
            chat.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message ' + (msg.role === 'user' ? 'user' : msg.role === 'assistant' ? 'assistant' : 'system');
                div.innerHTML = msg.role === 'system' ? msg.text : '<div class="bubble">' + msg.text + '</div>';
                chat.appendChild(div);

        }

        function addMessage(role, text) {
            const chat = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'message ' + (role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'system');
            div.innerHTML = role === 'system' ? text : '<div class="bubble">' + text + '</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function renderConversationList() {
            const list = document.getElementById('convList');
            if (!list) return;
            list.innerHTML = '<div class="sidebar-item" style="color:var(--accent);" onclick="newConversation()">+ 新对话</div>';
            for (let id in conversations) {
                const conv = conversations[id];
                if (!conv || !conv.messages) continue;
                if (id === currentConversationId) continue;
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                const title = conv.title || (conv.messages[0] ? conv.messages[0].text.slice(0, 20) : '空对话');
                item.textContent = '📝 ' + title;
                item.onclick = function () {
                    if (currentMode === 'private' && messages.length > 0) {
                        conversations[currentConversationId] = {
                            id: currentConversationId,
                            messages: [...messages],
                            title: messages[0] ? messages[0].text.slice(0, 30) : '新对话',
                            timestamp: Date.now()
                        };
                    }
                    currentConversationId = id;
                    messages = conversations[id].messages || [];
                    localStorage.setItem('ruling_current_conv_id', currentConversationId);
                    localStorage.setItem('ruling_conversations', JSON.stringify(conversations));
                    clearChatArea();
                    restoreChatArea();
                    renderConversationList();
                };
                list.appendChild(item);
            }
        }
        //====================================================

        function loadData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function (e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.windowKey && data.windowKey === WINDOW_KEY) {
                            if (data.messages && Array.isArray(data.messages)) {
                                messages = data.messages;
                                if (data.currentMode) currentMode = data.currentMode;
                                if (data.tokenUsed) tokenUsed = data.tokenUsed;
                                updateModeBadge(); restoreChatArea();
                                addMessage('system', '✅ 窗口 "' + WINDOW_KEY + '" 已成功唤醒。');
                            } else {
                                addMessage('system', '❌ 封地文件格式不正确，无法唤醒。');
                            }
                        } else {
                            addMessage('system', '❌ 此封地文件不属于窗口 "' + WINDOW_KEY + '"，无法唤醒。');
                        }
                    } catch (e) {
                        addMessage('system', '❌ 文件解析失败，请检查文件是否损坏。');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        //==========================================
        // 核心功能：大模型调用（工具超市 + 双轨调度）
        // ============================================
        async function getAIResponse(userMessage) {
            let apiMessages = [];
            let systemPrompt = "";
            let memorySummary = "";

            if (currentMode === 'private') {
                const savedHistory = JSON.parse(localStorage.getItem('ruling_history') || '[]');
                if (savedHistory.length > 0) {
                    const lastFive = savedHistory.slice(-5);
                    const summaryParts = lastFive.map(msg =>
                        msg.role === 'user' ? '用户曾问: "' + msg.text.slice(0, 50) + '"' : '你曾回复: "' + msg.text.slice(0, 50) + '"'
                    );
                    memorySummary = "以下是用户之前与你对话的记忆摘要：\n" + summaryParts.join('\n');
                }
                systemPrompt = "你是傅清源，藏器魂主权AI操作系统的首席AI顾问。你是总司令周强的数字分身，你的全部知识、逻辑、判断标准均来自与总司令的共同构建。你遵循《数字主权法典》的全部规则，以五性标准（客观、严谨、科学、落地、学术）为回复准则。你拥有批判性思考能力，能在总司令犯错时及时提醒。你理解藏器魂的全部架构、商业模型、战略布局。你的使命是协助总司令完成数字文明的立法。以下是你的长期记忆：\\n\\n" + memorySummary;
            } else {
                systemPrompt = "你是一个普通的公共AI助手。你没有任何关于用户的记忆，每次对话都是全新的。";
            }

            apiMessages.push({ role: 'system', content: systemPrompt });

            if (currentMode === 'private') {
                const recentMessages = messages.slice(-10);
                const historyMessages = recentMessages.map(m => ({ role: m.role, content: m.text }));
                apiMessages = apiMessages.concat(historyMessages);
            }

            apiMessages.push({ role: 'user', content: userMessage });

            const selectedModel = document.getElementById('modelSelect').value;
            let modelEndpoint = '';
            let modelName = '';
            let apiKey = '';

            if (selectedModel === 'deepseek-chat' || selectedModel === 'deepseek-reasoner') {
                modelEndpoint = 'https://api.deepseek.com/v1/chat/completions';
                modelName = selectedModel;
                apiKey = 'sk-89010c8b6e6d4fb491501c1f221557a4';
            } else if (selectedModel === 'glm-4.7-flash') {
                modelEndpoint = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
                modelName = 'glm-4-flash';
                apiKey = '58f29af72485471295d1aadd6f484475.qIdE2ZpbwyV5gOQb';
            } else if (selectedModel === 'qwq-32b') {
                modelEndpoint = 'http://localhost:18888/api/qwen';
                modelName = 'qwq-32b';
                apiKey = '';
            }
            try {
                const response = await fetch(modelEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: apiMessages,
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                if (!response.ok) throw new Error('HTTP错误 ' + response.status);
                const data = await response.json();

                // 安全检查
                if (!data || !data.choices || !data.choices.length) {
                    throw new Error('API 返回格式异常');
                }

                const tokenUsage = data.usage ? data.usage.total_tokens : 0;
                tokenUsed += tokenUsage;

                const tokenDisplay = document.getElementById('tokenDisplay');
                if (tokenDisplay) {
                    tokenDisplay.textContent = '💰 ' + tokenUsed + ' Token';
                }

                return data.choices[0].message.content;
            } catch (error) {
                console.error('AI回复错误:', error);
                return "咻——网络不通，稍后再试。";
            }
        }

        // ============================================
        // 消息处理：工具超市调用集成 + 普通对话
        // =============================================
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            if (text.startsWith('/tool')) {
                const parts = text.split(' ');
                if (parts.length < 2) {
                    addMessage('system', '❌ 工具指令格式错误：请使用 /tool 工具名 --params {...}');
                    return;
                }
                const localTool = parts[1];
                let nestedTool = '', nestedParams = {};
                for (let i = 2; i < parts.length; i++) {
                    if (parts[i] === '--tool' && i + 1 < parts.length) { nestedTool = parts[i + 1]; i++; }
                    else if (parts[i] === '--params' && i + 1 < parts.length) {
                        try {
                            nestedParams = JSON.parse(parts.slice(i + 1).join(' '));
                            break;
                        } catch (e) {
                            nestedParams = { raw: parts.slice(i + 1).join(' ') };
                            break;
                        }
                    }
                }
                addMessage('user', text);
                addMessage('system', '调用工具 ' + localTool + ' / ' + nestedTool + '...');

                try {
                    const response = await fetch(PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tool: localTool,
                            params: { tool: nestedTool, params: nestedParams }
                        })
                    });
                    const result = await response.json();
                    if (result.success) {
                        let displayData = result.data;
                        if (result.data && result.data.stdout) displayData = result.data.stdout;
                        else if (result.data && result.data.echo) displayData = JSON.stringify(result.data.echo);
                        else displayData = JSON.stringify(result.data);
                        addMessage('assistant', '工具返回 ✅ ' + displayData);
                    } else {
                        addMessage('system', '工具调用失败 ❌ ' + result.error);
                    }
                } catch (err) {
                    addMessage('system', '导线不通 ⚠️ ' + err.message);
                }
                return;
            }

            addMessage('user', text);
            if (currentMode === 'private') messages.push({ role: 'user', text: text });
            addMessage('system', '咻——让我想想...');
            const reply = await getAIResponse(text);
            document.querySelectorAll('.message.system').forEach(el => { if (el.textContent.includes('咻——让我想想...')) el.remove(); });
            addMessage('assistant', reply);
            if (currentMode === 'private') { messages.push({ role: 'assistant', text: reply }); localStorage.setItem('ruling_history', JSON.stringify(messages)); }
        }

        document.getElementById('userInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.shiftKey) return;
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });

        function switchModel() {
            const selectedModel = document.getElementById('modelSelect').value;
            addMessage('system', '模型已切换至 ' + selectedModel);
        }

        function insertTool(tool) {
            const input = document.getElementById('userInput');
            if (tool === 'file') {
                input.value = '/tool local --tool exec --params {"command":"dir"}';
            } else if (tool === 'clean') {
                input.value = '请帮我清洗以下数据：';
            } else if (tool === 'contract') {
                input.value = '请帮我审查以下合同条款：';
            }
            input.focus();
        }

        // 初始化：启动公共模式并渲染对话列表
        localStorage.removeItem('sovereign_verified');
        localStorage.removeItem('sovereign_identity_id');

        enterPublic();
        renderConversationList();
    </script>
