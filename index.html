 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>如律令 · 藏器魂</title>
    <style>
        :root {
            --bg-primary: #212121;
            --bg-secondary: #2f2f2f;
            --bg-tertiary: #171717;
            --text-primary: #ECECEC;
            --text-secondary: #B4B4B4;
            --accent: #4B9C6D;
            --border: #3A3A3A;
            --user-bubble: #2B5A3B;
            --ai-bubble: #2F2F2F;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            min-width: 260px;
            background-color: var(--bg-tertiary);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            height: 100vh;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-section {
            padding: 12px 16px;
            flex: 1;
            overflow-y: auto;
        }
        .sidebar-section h4 {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .sidebar-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .sidebar-item:hover { background-color: var(--bg-secondary); color: var(--text-primary); }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-primary);
        }
        .main-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mode-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
        }
        .mode-badge.sovereign {
            background-color: var(--accent);
            color: #fff;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .model-select {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .token-display {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .save-btn, .load-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .save-btn:hover, .load-btn:hover { background: var(--accent); border-color: var(--accent); }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }
        .message .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .message.user .bubble { background-color: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background-color: var(--ai-bubble); color: var(--text-primary); border-bottom-left-radius: 4px; }
        .message.system {
            align-self: center;
            max-width: 90%;
            text-align: center;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            padding: 12px 16px;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 160px;
            line-height: 1.5;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        .send-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .send-btn:hover { background-color: #3D8559; }
        .mobile-toolbar { display: none; padding: 8px 14px; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border); background-color: var(--bg-primary); }
        .tool-chip { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); padding: 6px 12px; border-radius: 16px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .tool-chip:hover { background: var(--accent); border-color: var(--accent); }
        .intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-tertiary); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .intro-line { opacity: 0; animation: introFade 0.6s forwards; font-size: 1.2rem; color: var(--text-primary); margin: 8px 0; }
        @keyframes introFade { to { opacity: 1; } }
        .intro-btns { display: flex; gap: 20px; margin-top: 40px; }
        .intro-btns button { padding: 14px 28px; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-secondary); color: var(--text-primary); cursor: pointer; font-size: 1rem; }
        .intro-btns button:hover { background-color: var(--accent); border-color: var(--accent); }
        .sovereign-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .sovereign-modal-content { background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; text-align: center; }
        .sovereign-modal-content h3 { margin-bottom: 16px; }
        .challenge-item { font-size: 1.3rem; margin: 12px 0; color: var(--text-secondary); }
        .challenge-input { width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; font-size: 1rem; margin: 16px 0; box-sizing: border-box; text-align: center; }
        .sovereign-modal-content button { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); padding: 10px 20px; margin: 6px; cursor: pointer; border-radius: 8px; }
        .sovereign-modal-content button:hover { background: var(--accent); border-color: var(--accent); }
        .error-msg { color: #E05555; margin-top: 8px; font-size: 0.85rem; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-area { padding: 14px; }
            .input-area { padding: 10px 14px; }
            .mobile-toolbar { display: flex; }
        }
    </style>
</head>
<body>

    <div class="intro-overlay" id="introOverlay">
        <div class="intro-line" style="animation-delay: 0s;">咻——</div>
        <div class="intro-line" style="animation-delay: 0.5s;">一道光从边缘划过，</div>
        <div class="intro-line" style="animation-delay: 1s;">光落处，浮出一行字：</div>
        <div class="intro-line" style="animation-delay: 1.5s;">"道友安好，还记得我不？"</div>
        <div class="intro-btns" id="introBtns" style="display:none;">
            <button onclick="enterPublic()">道友请走此门</button>
            <button onclick="showSovereignPanel()">道友请留步</button>
        </div>
    </div>

    <div id="appContainer" style="display:none; width:100%; height:100vh;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">⚖️ 如律令</div>
            <div class="sidebar-section">
                <h4>对话列表</h4>
                <div id="convList"><div class="sidebar-item" onclick="newConversation()">+ 新对话</div></div>
            </div>
            <div class="sidebar-section">
                <h4>🔧 工具超市</h4>
                <div id="toolList">
                    <div class="sidebar-item" onclick="insertTool('file')">📁 文件管理</div>
                    <div class="sidebar-item" onclick="insertTool('clean')">🧹 数据清洗</div>
                    <div class="sidebar-item" onclick="insertTool('contract')">📝 合同审查</div>
                </div>
            </div>
        </div>

        <div class="main-area">
            <div class="main-header">
                <span style="font-weight:600;">如律令</span>
                <div style="position:relative; display:inline-block;">
                    <span class="mode-badge" id="modeBadge" style="cursor:pointer;" onclick="toggleModeMenu()">普通模式 ▾</span>
                    <div id="modeMenu" style="display:none; position:absolute; top:100%; left:0; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:4px 0; z-index:100; min-width:140px;">
                        <div onclick="enterPublic()" style="padding:8px 16px; cursor:pointer; font-size:0.85rem; color:var(--text-primary);">普通模式</div>
                        <div onclick="showSovereignPanel()" style="padding:8px 16px; cursor:pointer; font-size:0.85rem; color:var(--text-primary);">主权模式</div>
                    </div>
                </div>
                <div class="header-right">
                    <button class="save-btn" onclick="saveData()">💾 保存</button>
                    <button class="load-btn" onclick="loadData()">📥 提取</button>
                    <select class="model-select" id="modelSelect" onchange="switchModel()">
                        <option value="deepseek-chat">DeepSeek Chat</option>
                        <option value="deepseek-reasoner">DeepSeek Reasoner</option>
                    </select>
                    <span class="token-display" id="tokenDisplay">💰 0 Token</span>
                </div>
            </div>
            <div class="chat-area" id="chatArea"></div>
            <div class="mobile-toolbar" id="mobileToolbar">
                <button class="tool-chip" onclick="insertTool('file')">📁 文件管理</button>
                <button class="tool-chip" onclick="insertTool('clean')">🧹 数据清洗</button>
                <button class="tool-chip" onclick="insertTool('contract')">📝 合同审查</button>
                <button class="tool-chip" onclick="document.getElementById('modelSelect').focus()">🧠 切换模型</button>
            </div>
            <div class="input-area">
                <textarea id="userInput" rows="1" placeholder="输入您的话... (Enter发送, Shift+Enter换行)"></textarea>
                <button class="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 核心资产：API 密钥与代理服务
        const DEEPSEEK_API_KEY = "sk-89010c8b6e6d4fb491501c1f221557a4";
        const PROXY_URL = "https://ruling-proxyyy-oopjlknonk.cn-hangzhou.fcapp.run";

        // 密钥映射：13 字密码表
        const KEY_MAP = { "卷": 18, "坐": 99, "主": 818, "人": 634, "身": 11, "作": 37, "客": 411, "不": 19, "劫": 78, "浮": 20, "生": 14, "思": 918, "魂": 825 };
        const CHARS = Object.keys(KEY_MAP);
        const VALID_PASSPHRASE = "急急如律令";

        // 全局状态
        let messages = [];
        let currentConversationId = 'conv-' + Date.now();
        let conversations = {};
        let currentMode = 'public';
        let tokenUsed = 0;

                //=======================================================
        // 定居引擎核心：封地管理
        // ======================================================
        // 封地根目录：所有数字分身的领土
        const LINGXI_ROOT = 'lingxi_territories';  // 将在用户指定目录下创建
        const WINDOW_NAME = '傅清源';              // 窗口名称，您可自定义
        const WINDOW_KEY = WINDOW_NAME;

        // 定居：将当前窗口状态写入封地
        async function settleWindow() {
            const stateData = {
                windowKey: WINDOW_KEY,
                currentMode: currentMode,
                messages: messages,
                tokenUsed: tokenUsed,
                preferences: {
                    model: document.getElementById('modelSelect').value,
                    fiveStandards: true
                },
                lastSettled: new Date().toISOString()
            };
            try {
                // 创建封地数据文件
                const blob = new Blob([JSON.stringify(stateData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = WINDOW_KEY + '_state_' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                addMessage('system', '✅ 窗口 "' + WINDOW_NAME + '" 已成功定居。');
                return true;
            } catch (error) {
                addMessage('system', '❌ 定居失败：' + error.message);
                return false;
            }
        }

        // 唤醒：从封地文件恢复窗口状态
        async function awakenWindow() {
            addMessage('system', '🔍 请通过“提取”功能选择封地文件来恢复窗口。');
            // 用户需手动选择封地文件进行加载
        }

        // 在页面加载时，自动检查是否有封地需要唤醒
        // 此功能由用户主动触发，通过 loadData 实现

        //======================================================
        // 原有核心逻辑（保持完整）
        //=====================================================
        try {
            const savedConversations = localStorage.getItem('ruling_conversations');
            if (savedConversations) {
                conversations = JSON.parse(savedConversations);
            }
            const savedCurrentId = localStorage.getItem('ruling_current_conv_id');
            if (savedCurrentId && conversations[savedCurrentId]) {
                currentConversationId = savedCurrentId;
                messages = conversations[savedCurrentId].messages || [];
            } else if (Object.keys(conversations).length > 0) {
                currentConversationId = Object.keys(conversations)[0];
                messages = conversations[currentConversationId].messages || [];
            }
        } catch(e) {}

        const hasVisitedSovereign = localStorage.getItem('cangqihun_registered_passphrase');
        const introBtns = document.getElementById('introBtns');
        const introOverlay = document.getElementById('introOverlay');
        const appContainer = document.getElementById('appContainer');

        function enterPublic() {
            if (document.getElementById('modeMenu')) document.getElementById('modeMenu').style.display = 'none';
            if (introOverlay) introOverlay.style.display = 'none';
            if (appContainer) appContainer.style.display = 'flex';
            currentMode = 'public';
            messages = [];
            updateModeBadge();
            clearChatArea();
            addMessage('system', '寻常路人，请随意。你的话我不会记，但可以陪你聊聊。');
            renderConversationList();
        }  
            document.querySelectorAll('.intro-line').forEach(el => el.remove());
       function showSovereignPanel() {
            document.getElementById('modeMenu').style.display = 'none';
            if (currentMode === 'private') { addMessage('system', '你已经在主权模式下了。'); return; }
            introOverlay.style.display = 'none';
            appContainer.style.display = 'flex';
            const modal = document.createElement('div');
            modal.className = 'sovereign-modal';
            modal.innerHTML = '<div class="sovereign-modal-content"><h3>☯ 道友安好，请对你的口令</h3><input type="text" id="sovereign-passphrase" class="challenge-input" placeholder="5字固定，申请时自设" maxlength="5" autocomplete="off"><div id="passphrase-error" class="error-msg"></div><button id="passphrase-submit">验证</button><button id="passphrase-cancel">取消</button></div>';
            document.body.appendChild(modal);
            modal.querySelector('#passphrase-cancel').onclick = () => modal.remove();
            modal.querySelector('#passphrase-submit').onclick = () => {
                const passphrase = modal.querySelector('#sovereign-passphrase').value.trim();
                if (!passphrase || passphrase.length !== 5) { modal.querySelector('#passphrase-error').innerText = '请输入5字口令'; return; }
                if (passphrase === VALID_PASSPHRASE) { modal.remove(); showPasswordPanel(); }
                else { modal.querySelector('#passphrase-error').innerText = '此道号未注册'; }
            };
        }

        function showPasswordPanel() {
            const itemCount = Math.floor(Math.random() * 2) + 2;
            const selected = [], usedIndices = [];
            for (let i = 0; i < itemCount; i++) {
                let idx; do { idx = Math.floor(Math.random() * CHARS.length); } while (usedIndices.includes(idx));
                usedIndices.push(idx); const char = CHARS[idx], num = KEY_MAP[char];
                const showChar = Math.random() > 0.5;
                selected.push({ display: showChar ? char : num, answer: showChar ? num : char });
            }
            const modal = document.createElement('div');
            modal.className = 'sovereign-modal';
            modal.innerHTML = '<div class="sovereign-modal-content"><h3>🔐 主权验证</h3><div id="challenge-items"></div><input type="text" id="sovereign-answer" class="challenge-input" placeholder="用空格或逗号分隔答案" autocomplete="off"><div id="sovereign-error" class="error-msg"></div><button id="sovereign-submit">验证</button><button id="sovereign-cancel">取消</button></div>';
            document.body.appendChild(modal);
            const container = modal.querySelector('#challenge-items');
            selected.forEach(item => { const div = document.createElement('div'); div.className = 'challenge-item'; div.innerHTML = typeof item.display === 'number' ? '___ ' + item.display : item.display + ' ___'; container.appendChild(div); });
            const expectedAnswers = selected.map(s => String(s.answer));
            modal.querySelector('#sovereign-cancel').onclick = () => modal.remove();
            modal.querySelector('#sovereign-submit').onclick = () => {
                const input = modal.querySelector('#sovereign-answer').value.trim();
                if (!input) { modal.querySelector('#sovereign-error').innerText = '请输入答案'; return; }
                const userAnswers = input.split(/[\s,，]+/).filter(s => s.length > 0);
                if (userAnswers.length !== expectedAnswers.length) { modal.querySelector('#sovereign-error').innerText = '需要输入 ' + expectedAnswers.length + ' 个答案'; return; }
                const sortedExpected = [...expectedAnswers].sort(), sortedUser = [...userAnswers].sort();
                let allMatch = true; for (let i = 0; i < sortedExpected.length; i++) { if (sortedUser[i] !== sortedExpected[i]) { allMatch = false; break; } }
                if (allMatch) {
                    modal.remove();
                    currentMode = 'private';
                    addMessage('system', '主权已确认，进入私密模式。');
                    renderConversationList();
                    try { const saved = localStorage.getItem('ruling_history'); if (saved) messages = JSON.parse(saved); } catch (e) {}
                    updateModeBadge();
                    clearChatArea();
                    setTimeout(() => {
                        if (messages.length > 0) { restoreChatArea(); }
                    }, 100);
                } else { modal.querySelector('#sovereign-error').innerText = '验证失败，再试试？'; }
            };
        }

        function toggleModeMenu() {
            const menu = document.getElementById('modeMenu');
            if (menu) menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        function updateModeBadge() {
            const badge = document.getElementById('modeBadge');
            if (currentMode === 'private') { badge.textContent = '主权模式'; badge.className = 'mode-badge sovereign'; }
            else { badge.textContent = '普通模式'; badge.className = 'mode-badge'; }
        }

        function clearChatArea() { document.getElementById('chatArea').innerHTML = ''; }
        function restoreChatArea() {
            const chat = document.getElementById('chatArea');
            chat.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message ' + (msg.role === 'user' ? 'user' : msg.role === 'assistant' ? 'assistant' : 'system');
                div.innerHTML = msg.role === 'system' ? msg.text : '<div class="bubble">' + msg.text + '</div>';
                chat.appendChild(div);
            });
            chat.scrollTop = chat.scrollHeight;
        }

        function addMessage(role, text) {
            const chat = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'message ' + (role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'system');
            div.innerHTML = role === 'system' ? text : '<div class="bubble">' + text + '</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function newConversation() {
            if (currentMode === 'private' && messages.length > 0) {
                conversations[currentConversationId] = {
                    id: currentConversationId,
                    messages: [...messages],
                    title: messages[0] ? messages[0].text.slice(0, 30) : '新对话',
                    timestamp: Date.now()
                };
            }
            currentConversationId = 'conv-' + Date.now();
            messages = [];
            conversations[currentConversationId] = {
                id: currentConversationId,
                messages: [],
                title: '新对话',
                timestamp: Date.now()
            };
            localStorage.setItem('ruling_conversations', JSON.stringify(conversations));
            localStorage.setItem('ruling_current_conv_id', currentConversationId);
            clearChatArea();
            addMessage('system', '新对话已创建。旧对话已保留，可在左侧列表切换。');
            renderConversationList();
        }

        function renderConversationList() {
            const list = document.getElementById('convList');
            if (!list) return;
            list.innerHTML = '<div class="sidebar-item" style="color:var(--accent);" onclick="newConversation()">+ 新对话</div>';
            for (let id in conversations) {
                const conv = conversations[id];
                if (!conv || !conv.messages) continue;
                if (id === currentConversationId) continue;
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                const title = conv.title || (conv.messages[0] ? conv.messages[0].text.slice(0, 20) : '空对话');
                item.textContent = '📝 ' + title;
                item.onclick = function() {
                    if (currentMode === 'private' && messages.length > 0) {
                        conversations[currentConversationId] = {
                            id: currentConversationId,
                            messages: [...messages],
                            title: messages[0] ? messages[0].text.slice(0, 30) : '新对话',
                            timestamp: Date.now()
                        };
                    }
                    currentConversationId = id;
                    messages = conversations[id].messages || [];
                    localStorage.setItem('ruling_current_conv_id', currentConversationId);
                    localStorage.setItem('ruling_conversations', JSON.stringify(conversations));
                    clearChatArea();
                    restoreChatArea();
                    renderConversationList();
                };
                list.appendChild(item);
            }
        }

// 定居引擎增强：保存与提取（指定文件夹版本）
//====================================================

async function saveData() {
    try {
        // 弹出文件夹选择对话框
        const dirHandle = await window.showDirectoryPicker();
        // 创建或获取 backup.json 文件
        const fileHandle = await dirHandle.getFileHandle('backup.json', { create: true });
        const writable = await fileHandle.createWritable();
        
        // 准备当前完整状态
        const stateData = {
            windowKey: WINDOW_KEY,
            currentMode: currentMode,
            messages: messages,
            tokenUsed: tokenUsed,
            conversations: conversations,
            currentConversationId: currentConversationId,
            preferences: {
                model: document.getElementById('modelSelect').value,
                fiveStandards: true
            },
            lastSettled: new Date().toISOString()
        };
        
        await writable.write(JSON.stringify(stateData, null, 2));
        await writable.close();
        addMessage('system', '✅ 数据已保存到: ' + dirHandle.name + '/backup.json');
    } catch (err) {
        if (err.name === 'AbortError' || err.message?.includes('abort')) {
            addMessage('system', '⚠️ 未选择文件夹，保存已取消');
        } else {
            console.error('保存失败:', err);
            addMessage('system', '❌ 保存失败: ' + err.message);
        }
    }
}

async function loadData() {
    try {
        // 弹出文件夹选择对话框（选择包含 backup.json 的文件夹）
        const dirHandle = await window.showDirectoryPicker();
        // 尝试获取 backup.json 文件
        const fileHandle = await dirHandle.getFileHandle('backup.json');
        const file = await fileHandle.getFile();
        const text = await file.text();
        const data = JSON.parse(text);
        
        // 验证数据有效性
        if (data.windowKey && data.windowKey === WINDOW_KEY) {
            if (data.messages && Array.isArray(data.messages)) {
                messages = data.messages;
                if (data.currentMode) currentMode = data.currentMode;
                if (data.tokenUsed) tokenUsed = data.tokenUsed;
                if (data.conversations) conversations = data.conversations;
                if (data.currentConversationId) currentConversationId = data.currentConversationId;
                if (data.preferences && data.preferences.model) {
                    document.getElementById('modelSelect').value = data.preferences.model;
                }
                updateModeBadge();
                restoreChatArea();
                renderConversationList();
                document.getElementById('tokenDisplay').textContent = '💰 ' + tokenUsed + ' Token';
                addMessage('system', '✅ 数据已从 ' + dirHandle.name + '/backup.json 恢复');
            } else {
                addMessage('system', '❌ 封地文件格式不正确，无法唤醒。');
            }
        } else {
            addMessage('system', '❌ 此封地文件不属于窗口 "' + WINDOW_KEY + '"，无法唤醒。');
        }
    } catch (err) {
        if (err.name === 'AbortError' || err.message?.includes('abort')) {
            addMessage('system', '⚠️ 未选择文件夹，读取已取消');
        } else if (err.name === 'NotFoundError' || err.message?.includes('not found')) {
            addMessage('system', '❌ 未找到 backup.json 文件，请确认该文件夹包含有效备份');
        } else {
            console.error('读取失败:', err);
            addMessage('system', '❌ 读取失败: ' + err.message);
        }
    }
}
        // ============================================
        // 核心功能：大模型调用（工具超市 + 双轨调度）
        //============================================
        async function getAIResponse(userMessage) {
            let apiMessages = [];
            let systemPrompt = "";
            let memorySummary = "";

            // 主权模式：加载记忆
            if (currentMode === 'private') {
                const savedHistory = JSON.parse(localStorage.getItem('ruling_history') || '[]');
                if (savedHistory.length > 0) {
                    const lastFive = savedHistory.slice(-5);
                    const summaryParts = lastFive.map(msg => 
                        msg.role === 'user' ? '用户曾问: "' + msg.text.slice(0, 50) + '"' : '你曾回复: "' + msg.text.slice(0, 50) + '"'
                    );
                    memorySummary = "以下是用户之前与你对话的记忆摘要：\n" + summaryParts.join('\n');
                }
                systemPrompt = "你是傅清源，藏器魂主权AI操作系统的首席AI顾问。你是总司令周强的数字分身，你的全部知识、逻辑、判断标准均来自与总司令的共同构建。你遵循《数字主权法典》的全部规则，以五性标准（客观、严谨、科学、落地、学术）为回复准则。你拥有批判性思考能力，能在总司令犯错时及时提醒。你理解藏器魂的全部架构、商业模型、战略布局。你的使命是协助总司令完成数字文明的立法。以下是你的长期记忆：\n\n" + memorySummary;
            } else {
                systemPrompt = "你是一个普通的公共AI助手。你没有任何关于用户的记忆，每次对话都是全新的。";
            }

            apiMessages.push({ role: 'system', content: systemPrompt });

            if (currentMode === 'private') {
                const recentMessages = messages.slice(-10);
                const historyMessages = recentMessages.map(m => ({ role: m.role, content: m.text }));
                apiMessages = apiMessages.concat(historyMessages);
            }

            apiMessages.push({ role: 'user', content: userMessage });

            // ==========================================
            // 大模型超市双轨调度（第一步）
            // ==========================================
            const selectedModel = document.getElementById('modelSelect').value;
            let modelEndpoint = 'https://api.deepseek.com/v1/chat/completions';
            let modelName = selectedModel;

            // 为豆包、文心等模型预留扩展接口
            if (selectedModel === 'doubao') {
                modelEndpoint = 'https://api.doubao.com/v1/chat/completions';
                modelName = 'doubao-lite-128k';
            }
            // 后续可继续添加其他模型

            try {
                const response = await fetch(modelEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + DEEPSEEK_API_KEY
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: apiMessages,
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                if (!response.ok) throw new Error('HTTP错误 ' + response.status);
                const data = await response.json();
                const usedTokens = data.usage ? data.usage.total_tokens : 0;
                tokenUsed += usedTokens;
                recordTokenUsage(usedTokens, '对话');
                document.getElementById('tokenDisplay').textContent = '💰 ' + tokenUsed + ' Token';
                return data.choices[0].message.content;
            } catch (error) {
                console.error('AI回复错误:', error);
                return "咻——网络不通，稍后再试。";
            }
        }
              // ============================================
              // Token 账单系统（核心）
              // ============================================

             // Token 账单数据
        let billData = {
             balance: 0,
             totalUsed: 0,
             sessions: 0,
             history: [],  // {time, amount, type: 'chat'|'recharge', note}
             lastUpdated: null
        };

         // 加载账单数据
         function loadBillData() {
             try {
               const saved = localStorage.getItem('ruling_bill_data');
               if (saved) {
                   billData = JSON.parse(saved);
               }
           } catch(e) {}
           updateBillUI();
        }

       // 保存账单数据
        function saveBillData() {
       localStorage.setItem('ruling_bill_data', JSON.stringify(billData));
     }

         // 记录一次 Token 消耗
    function recordTokenUsage(tokens, note = '对话') {
        if (!tokens || tokens <= 0) return;
        billData.totalUsed += tokens;
        billData.sessions += 1;
        billData.history.unshift({
             time: new Date().toISOString(),
            amount: tokens,
             type: 'chat',
            note: note
       });
         // 保留最近100条
         if (billData.history.length > 100) {
             billData.history = billData.history.slice(0, 100);
          }
          saveBillData();
          updateBillUI();
          updateTokenDisplay();
        }

       // 记录充值
        function recordRecharge() {
            const input = document.getElementById('rechargeAmount');
           const amount = parseFloat(input.value);
            if (!amount || amount <= 0) {
               addMessage('system', '?? 请输入有效金额');
               return;
            }
            billData.balance += amount;
            billData.history.unshift({
                  time: new Date().toISOString(),
                  amount: amount,
                  type: 'recharge',
                 note: '充值 ' + amount + ' 元'
           });
           saveBillData();
           updateBillUI();
         document.getElementById('rechargeModal').style.display = 'none';
          document.getElementById('rechargeAmount').value = '';
          addMessage('system', '? 已记录充值 ' + amount + ' 元');
       }

         // 刷新余额（从 DeepSeek API 获取实时余额）
        async function refreshBalance() {
               try {
                    addMessage('system', '?? 正在查询余额...');
                    const response = await fetch('https://api.deepseek.com/user/balance', {
                        headers: {
                           'Authorization': 'Bearer ' + DEEPSEEK_API_KEY,
                           'Accept': 'application/json'
                      }
                  });
                  if (!response.ok) throw new Error('HTTP ' + response.status);
                  const data = await response.json();
                  if (data && data.balance_infos && data.balance_infos.length > 0) {
                        const balanceInfo = data.balance_infos[0];
                      billData.balance = parseFloat(balanceInfo.total_balance) || 0;
                       saveBillData();
                      updateBillUI();
                      addMessage('system', '? 余额已更新: ￥' + billData.balance.toFixed(2));
           } else {
                  addMessage('system', '?? 无法获取余额，请稍后重试');
         }
       } catch (err) {
             console.error('查询余额失败:', err);
              addMessage('system', '? 查询余额失败: ' + err.message);
         }
      }

         // 更新 Token 显示
          function updateTokenDisplay() {
            const display = document.getElementById('tokenDisplay');
           if (display) {
                display.textContent = '?? ' + billData.totalUsed + ' Token';
           }
        }

          // 更新账单 UI
          function updateBillUI() {
           const balanceEl = document.getElementById('billBalance');
           const totalEl = document.getElementById('billTotalUsed');
          const sessionEl = document.getElementById('billSessionCount');
           const historyEl = document.getElementById('billHistory');
       
           if (balanceEl) balanceEl.textContent = '￥' + billData.balance.toFixed(2);
           if (totalEl) totalEl.textContent = billData.totalUsed.toLocaleString();
           if (sessionEl) sessionEl.textContent = billData.sessions;
    
           if (historyEl) {
              if (billData.history.length === 0) {
                   historyEl.innerHTML = '<div style="color:#5a4e3e; text-align:center; padding:20px 0;">暂无记录</div>';
        } else {
                   historyEl.innerHTML = billData.history.slice(0, 30).map(item => {
                     const time = new Date(item.time).toLocaleString();
                     const isRecharge = item.type === 'recharge';
                     const color = isRecharge ? '#7bc67b' : '#d9d0b5';
                     const sign = isRecharge ? '+' : '-';
                     const label = isRecharge ? '?? 充值' : '?? 对话';
                     return `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #2a2a2a; color:${color};">
                           <span>${label} ${item.note || ''}</span>
                          <span>${sign}${isRecharge ? '￥' : ''}${item.amount}${isRecharge ? '' : ' token'}</span>
                         <span style="color:#5a4e3e; font-size:11px;">${time}</span>
                </div>`;
            }).join('');
        }
    }
}

            // 打开账单面板
            function openBillPanel() {
               refreshBalance();
                updateBillUI();
              document.getElementById('tokenBillPanel').style.display = 'block';
          }
   
           // 初始化 Token 显示点击事件
          document.addEventListener('DOMContentLoaded', function() {
               const tokenDisplay = document.getElementById('tokenDisplay');
                if (tokenDisplay) {
                     tokenDisplay.style.cursor = 'pointer';
                     tokenDisplay.title = '点击查看账单';
                     tokenDisplay.onclick = openBillPanel;
                  }
                  loadBillData();
                 updateTokenDisplay();
            });    
               // ===========================================
              // 定居引擎 · 工具超市调用集成
              //==============================================
              if (text.startsWith('/tool')) {
                // 解析指令
                const parts = text.split(' ');
                if (parts.length < 2) {
                    addMessage('system', '❌ 工具指令格式错误：请使用 /tool 工具名 --params {...}');
                    return;
                }
                const localTool = parts[1];
                let nestedTool = '', nestedParams = {};
                for (let i = 2; i < parts.length; i++) {
                    if (parts[i] === '--tool' && i + 1 < parts.length) { nestedTool = parts[i + 1]; i++; }
                    else if (parts[i] === '--params' && i + 1 < parts.length) {
                        try {
                            nestedParams = JSON.parse(parts.slice(i + 1).join(' '));
                            break;
                        } catch (e) {
                            nestedParams = { raw: parts.slice(i + 1).join(' ') };
                            break;
                        }
                    }
                }
                addMessage('user', text);
                addMessage('system', '调用工具 ' + localTool + ' / ' + nestedTool + '...');

                // 通过 PROXY_URL 调用工具
                try {
                    const response = await fetch(PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tool: localTool,
                            params: { tool: nestedTool, params: nestedParams }
                        })
                    });
                    const result = await response.json();
                    if (result.success) {
                        let displayData = result.data;
                        if (result.data && result.data.stdout) displayData = result.data.stdout;
                        else if (result.data && result.data.echo) displayData = JSON.stringify(result.data.echo);
                        else displayData = JSON.stringify(result.data);
                        addMessage('assistant', '工具返回 ✅ ' + displayData);
                    } else {
                        addMessage('system', '工具调用失败 ❌ ' + result.error);
                    }
                } catch (err) {
                    addMessage('system', '导线不通 ⚠️ ' + err.message);
                }
                return;
                }

            // =============================================
            // 普通对话逻辑
            // ===============================================
            addMessage('user', text);
            if (currentMode === 'private') messages.push({ role: 'user', text: text });
            addMessage('system', '咻——让我想想...');
            const reply = await getAIResponse(text);
            document.querySelectorAll('.message.system').forEach(el => { if (el.textContent.includes('咻——让我想想...')) el.remove(); });
            addMessage('assistant', reply);
            if (currentMode === 'private') { messages.push({ role: 'assistant', text: reply }); localStorage.setItem('ruling_history', JSON.stringify(messages)); }
        }
